name: Fetch licensed Tokaido photo assets

on:
  push:
    branches:
      - photo-assets-collection
    paths:
      - "photos/download_commons_photos.py"
      - ".github/workflows/fetch-photo-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-commons-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out photo research branch
        uses: actions/checkout@v4
        with:
          ref: photo-assets-collection
          persist-credentials: true
      - name: Download licensed candidate photos
        run: python3 photos/download_commons_photos.py
      - name: Commit photo files and attribution
        run: |
          if git diff --quiet -- photos/assets photos/ATTRIBUTION.md; then
            echo "No new photo files to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add photos/assets photos/ATTRIBUTION.md
          git commit -m "Add licensed Tokaido photo assets with attribution"
          git push origin HEAD:photo-assets-collection
