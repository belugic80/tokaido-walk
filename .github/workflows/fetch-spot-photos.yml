name: Fetch spot photos
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_spot_photos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spots build/spot_photos.json
          git diff --cached --quiet || git commit -m "명물 사진 자동 수집(위키미디어 커먼즈)"
          git push
