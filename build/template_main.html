<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=880">
<title>東海道 53の休符</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#d62839">
<script>try{var t=localStorage.getItem('tk-theme')||'light';if(t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9cfb4; --card:#fbf7ec; --cream:#f1e9d2; --line:#e2d8bf;
  --ink:#1b2433; --ink-soft:#3d4350; --ink-faint:#6d6a5f;
  --accent:#d62839; --accent-ink:#a81f2d; --ink2:#1d3557;
  --bar:#e7dec6;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171310; --card:#241f19; --cream:#241f19; --line:#352e24;
  --ink:#f1ece0; --ink-soft:#cfc7b4; --ink-faint:#9e9686;
  --accent:#e85a62; --accent-ink:#f08088; --ink2:#7fa0c8; --bar:#3a3327; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171310; --card:#241f19; --cream:#241f19; --line:#352e24;
  --ink:#f1ece0; --ink-soft:#cfc7b4; --ink-faint:#9e9686;
  --accent:#e85a62; --accent-ink:#f08088; --ink2:#7fa0c8; --bar:#3a3327; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
img{max-width:100%}
.jp{font-family:'Noto Serif JP',serif}
#app{width:880px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:92px;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap}
.brand .jp{font-size:12px;color:var(--ink-faint);font-weight:500}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}

.hero{position:relative;margin:0 18px;height:260px;border-radius:22px;overflow:hidden;background:#1d3557 center 42%/cover;background-image:var(--heroBg,none)}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,28,44,.55) 0%,rgba(20,28,44,.15) 32%,rgba(20,28,44,.58) 60%,rgba(20,28,44,.93) 100%)}
.hero-top{position:absolute;left:14px;right:14px;top:14px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wxchip{display:flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:12px;background:rgba(251,247,236,.94);white-space:nowrap;font-size:12px;font-weight:700;color:#1b2433}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:34px;height:34px;border-radius:12px;border:0;background:rgba(251,247,236,.94);color:#1b2433;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.daynav button:disabled{opacity:.35;cursor:default}
.daypill{height:34px;padding:0 12px;border-radius:12px;background:rgba(251,247,236,.94);display:flex;align-items:center;gap:7px;white-space:nowrap}
.daypill b{font-size:13px;font-weight:800;color:var(--accent)}
.daypill span{font-size:12.5px;font-weight:700;color:#1b2433}
.daypill .tag{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px}
.todaybtn{height:34px;padding:0 11px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:11.5px;font-weight:800;cursor:pointer}
.hero-txt{position:absolute;left:22px;right:22px;top:66px;z-index:2;color:#fff}
.hero-txt .jpline{font-size:12px;opacity:.88;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-txt h2{font-size:25px;font-weight:800;line-height:1.25;letter-spacing:-.02em;margin:3px 0 0}
.hero-txt .sum{font-size:12.5px;opacity:.85;margin-top:4px}
.hero-bar{position:absolute;left:22px;right:22px;bottom:12px;z-index:2;display:flex;align-items:center;gap:10px;color:#fff}
.hero-bar .end{font:700 11px 'Noto Serif JP',serif;white-space:nowrap;opacity:.9}
.track{position:relative;flex:1;min-width:0;height:18px}
.track .rail{position:absolute;left:0;right:0;top:7px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 5px,transparent 5px 10px)}
.track .fill{position:absolute;left:0;top:7px;height:3px;border-radius:2px;background:#fff}
.track .me{position:absolute;top:1px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.hero-bar .km{font-size:11px;white-space:nowrap;opacity:.9;font-variant-numeric:tabular-nums}

.sec{margin:14px 18px 0}
.sec h3{font-size:14px;font-weight:800;margin:0 0 9px;display:flex;align-items:center;gap:7px}
.sec h3 .aside{font-size:11.5px;color:var(--ink-faint);font-weight:500}
.card{background:var(--card);border-radius:18px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 13px}
.stat .lab{display:flex;align-items:center;gap:6px;height:18px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.stat .val{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:6px}
.stat .num{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .unit{font-size:11px;font-weight:700;margin-left:2px}
.stat .sub{text-align:right;font-size:10px;line-height:1.3;color:var(--ink-faint);white-space:nowrap}
.stat .sub b{display:block;font-weight:800;color:var(--ink)}
.stat .bar{height:4px;border-radius:2px;background:var(--bar);overflow:hidden;margin-top:8px}
.stat .bar i{display:block;height:100%;border-radius:2px}
.hcrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-faint);margin-top:8px}
.hcrow button{border:0;background:none;color:var(--accent);font-weight:700;font-size:11.5px;cursor:pointer;padding:0}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--card);border-radius:18px;padding:13px 14px 14px}
.panel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.panel .hd h4{font-size:14px;font-weight:800;margin:0}
.panel .hd a,.panel .hd button{font-size:12px;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;white-space:nowrap}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;background:var(--bg);min-height:260px}
.mapwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.stoplist a{display:flex;align-items:stretch;gap:12px;color:var(--ink);border-radius:10px}
.stoplist a:hover{background:var(--bg)}
.sdot{width:30px;flex:none;display:flex;flex-direction:column;align-items:center}
.sdot i{width:2px;flex:1;min-height:6px;background:var(--line)}
.sdot b{width:28px;height:28px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid var(--line)}
.srow{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:6px 4px 6px 0}
.srow .nm{font-size:14.5px;font-weight:700;flex:none}
.srow .jp{font-size:11px;color:var(--ink-faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{flex:none;font-size:12px;font-weight:800;color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums}
.ctabtn{display:block;text-align:center;margin-top:10px;height:44px;line-height:44px;border-radius:22px;background:var(--ink2);color:#fff;font-size:13.5px;font-weight:800}

.placegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pcard a{color:inherit}
.pimg{position:relative;height:72px;border-radius:10px;background:var(--bg);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pnum{position:absolute;left:6px;top:6px;width:18px;height:18px;border-radius:50%;background:var(--ink2);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.pname{display:flex;align-items:baseline;gap:5px;margin-top:7px}
.pname b{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pname span{flex:none;font-size:10.5px;color:var(--ink-faint)}
.pdesc{font-size:11.5px;color:var(--ink-faint);margin-top:1px;line-height:1.4}

.lcard{display:flex;gap:12px;align-items:center}
.lcard .pic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--bg) center/cover}
.lcard .tx{flex:1;min-width:0}
.lcard .lab{font-size:11.5px;color:var(--ink-faint)}
.lcard .nm{font-size:14.5px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .nm .jp{font-size:11px;color:var(--ink-faint);font-weight:500}
.lcard .nt{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.nextcard{display:flex;align-items:center;gap:12px}
.nextcard .tx{flex:1;min-width:0}
.nextcard .lab{font-size:11.5px;color:var(--ink-faint)}
.nextcard .path{font-size:13.5px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextcard .km{font-size:12px;margin-top:2px}
.nextcard .km b{color:var(--accent)}
.nextcard .arrow{font-size:20px;color:var(--ink-faint)}

.restbox{padding:14px 16px}
.restbox .big{font-size:16px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--bg)}

.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:880px;display:flex;padding:0 8px 10px;background:var(--card);box-shadow:0 -1px 0 var(--line);z-index:20}
.bottomnav a{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink-faint);padding:9px 0 2px;text-decoration:none}
.bottomnav a.on{color:var(--accent)}
.bottomnav .bar{width:36px;height:3px;border-radius:0 0 3px 3px;margin-bottom:6px}
.bottomnav a.on .bar{background:var(--accent)}
.bottomnav .pill{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.bottomnav a.on .pill{background:#f6dcd8}
:root[data-theme="dark"] .bottomnav a.on .pill{background:#402224}
.bottomnav span.lb{font-size:12px;font-weight:600}
.bottomnav a.on span.lb{font-weight:800}

@keyframes tkpulse{0%{box-shadow:0 0 0 0 rgba(214,40,57,.45)}100%{box-shadow:0 0 0 10px rgba(214,40,57,0)}}
.muted{color:var(--ink-faint)}
.oldlink{display:block;text-align:center;font-size:11.5px;color:var(--ink-faint);margin:18px 18px 0;padding-bottom:2px}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">東海道 <span class="jp">53の休符</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="밝게/어둡게/자동" aria-label="화면 밝기 바꾸기">◐</button>
  </div>
  <div id="main"></div>
  <a class="oldlink" href="/old_home">예전 화면으로 보기 →</a>
  <nav class="bottomnav" id="bottomnav"></nav>
</div>
<script>
const DATA = /*__DATA__*/null;
const TRIP_START = new Date(2026, 11, 4);
const EXTRA_LL = {1:'35.6285,139.7387',2:'35.6285,139.7387',20:'35.0657,136.6838',28:'34.7967,135.2477',29:'34.7967,135.2477',30:'34.6664,135.5003',31:'34.4347,135.2440'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lines(s){ return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }
const dateOf = n => { const d = new Date(TRIP_START); d.setDate(d.getDate() + n - 1); return d; };
const isoDay = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const isoToDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, k) => { const d = isoToDate(s); d.setDate(d.getDate() + k); return isoDay(d); };
const todayIso = () => isoDay(new Date());
const dowOf = s => '일월화수목금토'[isoToDate(s).getDay()];
function todayN(){ const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.floor((t - TRIP_START) / 864e5) + 1; }
function ll(d){
  if (d.route.length) return d.route[d.route.length - 1].ll;
  if (EXTRA_LL[d.n]) return EXTRA_LL[d.n];
  for (let i = d.n - 2; i >= 0; i--) { const p = DATA.days[i]; if (p.route.length) return p.route[p.route.length - 1].ll; }
  return '35.0,138.5';
}
function walkedBefore(n){ return DATA.days.filter(d => d.n < n).reduce((s, d) => s + (d.km || 0), 0); }
const GOAL = DATA.days.filter(d => d.n <= 25).reduce((s, d) => s + (d.km || 0), 0);
const MILES = [[4, '하코네'], [10, '시즈오카'], [14, '하마나호'], [19, '나고야'], [22, '스즈카 고개']];
function hotelName(s){ const f = lines(s)[0] || ''; return f.split(/,|·/)[0].replace(/\(.*?\)/g, '').trim(); }
function hotelDay(d){ let hd = d; while ((!hd.h1 || /위와 같음/.test(hd.h1)) && hd.n > 1 && DATA.days[hd.n - 2].stay === d.stay) hd = DATA.days[hd.n - 2]; return hd; }
function hotelInfo(d){ const hd = hotelDay(d), all = lines(hd.h1).join(' '); const m = all.match(/([\d,]+원\/박)/); return { ko: hotelName(hd.h1) || hd.stay, price: m ? m[1] : '', town: hd.stayQ || '', ll: hd.route.length ? hd.route[hd.route.length - 1].ll : ll(d) }; }

/* 사진: 위키백과 검색 (키 없음, 기존 사이트와 같은 방식) */
const PHOTO_CACHE = {};
function cacheGet(k){ if (PHOTO_CACHE[k]) return PHOTO_CACHE[k]; try { const v = sessionStorage.getItem('ph:' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function cacheSet(k, v){ PHOTO_CACHE[k] = v; try { sessionStorage.setItem('ph:' + k, JSON.stringify(v)); } catch(e){} }
async function wikiImg(q){
  const k = 'w:' + q; const c = cacheGet(k); if (c) return c;
  const u = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages|info&piprop=thumbnail&pithumbsize=700&inprop=url&gsrsearch=' + encodeURIComponent(q);
  try { const j = await (await fetch(u)).json();
    const ps = Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index).filter(p => p.thumbnail);
    const r = ps.length ? { src: ps[0].thumbnail.source, href: ps[0].fullurl } : null;
    cacheSet(k, r); return r;
  } catch(e){ return null; }
}

/* 삼성 헬스 (HC Webhook → Supabase) */
const HC_URL = 'https://jmfvsusybouibqmdvtmy.supabase.co/functions/v1/hc-read';
let HCKEY = ''; try { HCKEY = localStorage.getItem('tk-hckey') || ''; } catch(e){}
(function(){ const m = location.hash.match(/[#&]k=([\w-]+)/); if (m) { HCKEY = m[1]; try { localStorage.setItem('tk-hckey', HCKEY); } catch(e){} history.replaceState(null, '', location.pathname); } })();
let HCD = {}, HCLAST = null; try { const c = JSON.parse(localStorage.getItem('tk-hc2') || 'null'); if (c) { HCD = c.byDate || {}; HCLAST = c; } } catch(e){}
let HCSTATE = HCKEY ? 'wait' : 'off';
async function loadHC(){
  if (!HCKEY || !navigator.onLine) return;
  const to = todayIso(); let from = addDays(to, -119); const ts = isoDay(TRIP_START); if (to >= ts && ts < from) from = ts;
  try {
    const res = await fetch(`${HC_URL}?from=${from}&to=${to}`, { headers: { 'x-read-key': HCKEY }, cache: 'no-store' });
    if (res.status === 401) { HCSTATE = 'badkey'; return; }
    if (!res.ok) throw 0;
    const j = await res.json(), out = {};
    Object.entries(j.days || {}).forEach(([k, s]) => { if (!(s.steps || s.km || s.min)) return;
      out[k] = { km: Math.max(+s.km || 0, +s.exKm || 0), steps: s.steps || 0, min: s.min ?? null, kcal: s.kcal ?? s.kcalActive ?? null }; });
    HCD = out; HCSTATE = 'ok';
    HCLAST = { byDate: out, last: j.last, today: (j.days || {})[to] || null, at: Date.now() };
    try { localStorage.setItem('tk-hc2', JSON.stringify(HCLAST)); } catch(e){}
    render();
  } catch(e){ HCSTATE = 'err'; }
}

/* 날씨: Open-Meteo (무료, 키 없음) */
const WX_CACHE = {};
async function fillWeather(d){
  const el = document.querySelector('[data-wx]'); if (!el) return;
  const [la, lo] = el.dataset.wx.split(','), day = el.dataset.date, key = el.dataset.wx + day;
  try {
    const j = WX_CACHE[key] || (WX_CACHE[key] = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset&timezone=Asia%2FTokyo&start_date=${day}&end_date=${day}`)).json());
    const t = j.daily; if (!t || !t.time || !t.time.length) return;
    const hi = Math.round(t.temperature_2m_max[0]), lo2 = Math.round(t.temperature_2m_min[0]), pr = t.precipitation_probability_max[0];
    const sset = t.sunset ? new Date(t.sunset[0]) : null;
    el.textContent = `${lo2}° / ${hi}°`;
    const s = document.querySelector('[data-wxsub]'); if (s) s.textContent = `강수 ${pr ?? '-'}%${sset ? ` · 일몰 ${String(sset.getHours()).padStart(2,'0')}:${String(sset.getMinutes()).padStart(2,'0')}` : ''}`;
  } catch(e){}
}

/* ---- 일차별 데이터 가공 ---- */
function dayData(n){
  const d = DATA.days[n - 1];
  const stops = d.route.map((r, i) => ({ name: r.name.replace(/\s*\(숙소\)\s*/, ''), hotel: /\(숙소\)/.test(r.name), ll: r.ll, rel: d.nodes[i] ?? 0 }));
  const first = stops[0], last = stops[stops.length - 1];
  const hrs = d.wt;
  const stayLabel = d.stay && d.stay !== '-' ? d.stay : (d.type || d.region || '');
  const title = d.walkSeg ? d.walkSeg.replace(/\s*\(.*?\)\s*/g, ' ').trim() : (first && last ? `${esc(first.name)} → ${esc(last.name)}` : stayLabel);
  const spots = (d.photos && d.photos.s || []).slice(0, 4);
  return { n, d, stops, dist: d.km || 0, title, stayLabel, summary: d.km ? `${d.km} km · 약 ${hrs || '-'} · 지점 ${stops.length}곳` : (d.type || ''), spots };
}
function stationsThru(n, frac){
  let done = 0;
  for (let i = 0; i < n - 1; i++) { const m = DATA.days[i].stations.map(s => parseInt(s)).filter(Boolean); if (m.length) done = Math.max(done, Math.max(...m)); }
  const here = DATA.days[n - 1].stations.map(s => parseInt(s)).filter(Boolean);
  if (here.length) done = Math.max(done, done + Math.round((Math.max(...here) - done) * frac));
  return Math.min(53, done);
}

let view = Math.min(Math.max(todayN(), 1), DATA.days.length);
const trueToday = Math.min(Math.max(todayN(), 1), DATA.days.length);

function render(){
  const dd = dayData(view), tn = todayN();
  const isToday = view === tn, isPast = view < tn, hasTrip = tn >= 1 && tn <= DATA.days.length;
  const walkDay = dd.dist > 0;

  /* 오늘 실제 기록: 보는 날과 무관하게 항상 '진짜 오늘' 기준 */
  const todayIsoKey = todayIso();
  const hc = HCD[todayIsoKey] || null;
  const todayTarget = (hasTrip && DATA.days[tn - 1].km > 0) ? DATA.days[tn - 1].km : 8;
  const walkedKm = hc ? Math.min(todayTarget, hc.km || 0) : 0;
  const remainKm = Math.max(0, todayTarget - walkedKm);
  const steps = hc ? (hc.steps || 0) : 0;
  const mins = hc ? (hc.min || 0) : 0;
  const kcal = hc && hc.kcal != null ? Math.round(hc.kcal) : Math.round(walkedKm * 52);

  /* 실제 누적 진행(실제 걸은 거리 합) */
  let achieved = 0;
  for (const day of DATA.days) { if (!day.km) continue; const k = isoDay(dateOf(day.n)); if (k > todayIsoKey) continue; const r = HCD[k]; achieved += Math.min(day.km, r ? (r.km || 0) : 0); }
  const pos = walkedBefore(hasTrip ? tn : 1) + (hasTrip ? Math.min(DATA.days[tn - 1].km || 0, (HCD[todayIsoKey] || {}).km || 0) : 0);
  const posClamped = Math.min(GOAL, Math.max(achieved, pos));
  const pct = k => Math.min(100, k / GOAL * 100);
  const stDone = stationsThru(hasTrip ? tn : 1, todayTarget ? walkedKm / todayTarget : 0);

  const tag = isToday ? ['오늘', '#fff', 'var(--accent)'] : isPast ? ['지난 날', 'var(--ink-faint)', 'var(--line)'] : ['예정', 'var(--ink-faint)', 'var(--line)'];
  const stateLabel = tn < 1 ? `출발까지 D-${1 - tn}` : tn > DATA.days.length ? '여행 완료' : `${tn}일차`;
  const heroQ = dd.spots[0] ? dd.spots[0][1] : (dd.d.stayQ || dd.d.stay);

  const heroHtml = `
  <div class="hero" id="hero" style="--heroBg:none">
    <div class="hero-top">
      <div class="wxchip"><span id="wxval">·</span><span class="muted" style="margin-left:4px;font-weight:500" data-wxsub>${esc(stateLabel)}</span></div>
      <div class="daynav">
        ${!isToday ? `<button class="todaybtn" id="goToday">오늘</button>` : ''}
        <button id="prevDay" ${view <= 1 ? 'disabled' : ''} aria-label="이전 날">‹</button>
        <div class="daypill"><b>${dd.n}일차</b><span>${esc(dd.d.date)} (${esc(dd.d.dow)})</span><span class="tag" style="color:${tag[1]};background:${tag[2]}">${tag[0]}</span></div>
        <button id="nextDay" ${view >= DATA.days.length ? 'disabled' : ''} aria-label="다음 날">›</button>
      </div>
    </div>
    <div class="hero-txt">
      <div class="jpline jp">${esc(dd.stops.map(s=>s.name).join(' → ') || dd.stayLabel)}</div>
      <h2>${esc(dd.title)}</h2>
      <div class="sum">${esc(dd.summary)}</div>
    </div>
    <div class="hero-bar">
      <span class="end jp">品川</span>
      <div class="track"><div class="rail"></div><div class="fill" style="width:${pct(posClamped)}%"></div>
        ${MILES.map(([n,label]) => `<span style="position:absolute;left:${pct(walkedBefore(n+1))}%;top:7px;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:${walkedBefore(n+1)<=posClamped?'#fff':'rgba(255,255,255,.5)'};border:1.5px solid #fff"></span>`).join('')}
        <div class="me" style="left:${pct(posClamped)}%"></div></div>
      <span class="end jp">京都</span>
      <span class="km">${stDone}/53 역참</span>
    </div>
  </div>`;

  const statHtml = `
  <div class="sec"><h3>오늘 실제 기록 <span class="aside">· ${esc(mdOf(todayIsoKey))} (${dowOf(todayIsoKey)}) · 삼성 헬스 연동</span></h3>
    <div class="statgrid">
      <div class="stat"><div class="lab">걸은 거리</div><div class="val"><div class="num" style="color:var(--accent)">${walkedKm.toFixed(1)}<span class="unit">km</span></div><div class="sub">목표<b>${todayTarget}km</b></div></div><div class="bar"><i style="width:${Math.min(100,Math.round(walkedKm/todayTarget*100))}%;background:var(--accent)"></i></div></div>
      <div class="stat"><div class="lab">남은 거리</div><div class="val"><div class="num">${remainKm.toFixed(1)}<span class="unit">km</span></div><div class="sub">걸음<b>${steps.toLocaleString('ko-KR')}보</b></div></div><div class="bar"><i style="width:${Math.min(100,Math.round(steps/20000*100))}%;background:var(--ink2)"></i></div></div>
      <div class="stat"><div class="lab">걸은 시간</div><div class="val"><div class="num">${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')}</div><div class="sub">소모<b>${kcal}kcal</b></div></div><div class="bar"><i style="width:${Math.min(100,Math.round(mins/(todayTarget*15)*100))}%;background:var(--ink2)"></i></div></div>
      <div class="stat"><div class="lab">전체 진행</div><div class="val"><div class="num">${Math.round(pct(posClamped))}<span class="unit">%</span></div><div class="sub">남음<b>${Math.round(GOAL-posClamped)}km</b></div></div><div class="bar"><i style="width:${Math.round(pct(posClamped))}%;background:var(--accent)"></i></div></div>
    </div>
    <div class="hcrow">${HCKEY ? (HCSTATE==='badkey' ? '열쇠가 맞지 않음' : HCSTATE==='err' ? '지금은 불러오지 못함 · 저장된 기록 표시' : HCLAST && HCLAST.last ? '연결됨 · 삼성 헬스에서 자동으로 받아옵니다' : '아직 받은 데이터 없음') : '삼성 헬스가 연결되어 있지 않습니다'}<span class="spacer" style="flex:1"></span><button id="hcRefresh">지금 새로 받기</button></div>
  </div>`;

  let bodyHtml = '';
  if (walkDay) {
    const stopsHtml = dd.stops.map((s, i) => { const end = i === 0 || i === dd.stops.length - 1;
      return `<a href="https://www.google.com/maps/search/?api=1&query=${s.ll}" target="_blank" rel="noopener">
        <div class="sdot">${i===0?'':''}<b style="background:${end?'var(--ink2)':'var(--card)'};color:${end?'#fff':'var(--ink)'};border-color:var(--ink2)">${s.hotel?'숙':i===0?'출':i===dd.stops.length-1?'착':i}</b><i style="${i===dd.stops.length-1?'display:none':''}"></i></div>
        <div class="srow"><span class="nm">${esc(s.name)}</span><span class="jp"></span><span class="meta">${s.rel}km</span></div></a>`;}).join('');
    const mapQ = dd.stops.length > 1 ? `https://www.google.com/maps?saddr=${dd.stops[0].ll}&daddr=${dd.stops.slice(1).map(s=>s.ll).join('+to:')}&dirflg=w&output=embed&hl=ko` : `https://www.google.com/maps?q=${ll(dd.d)}&z=13&output=embed&hl=ko`;
    const placesHtml = dd.spots.map(([name, q], i) => {
      const hit = dd.stops.find(s => s.name.length >= 3 && (name.includes(s.name) || s.name.includes(name)));
      return `<div class="pcard"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}" target="_blank" rel="noopener">
        <div class="pimg" id="pimg-${dd.n}-${i}"><div class="pnum">${i+1}</div></div>
        <div class="pname"><b>${esc(name)}</b>${hit?`<span>${hit.rel}km</span>`:''}</div></a></div>`;}).join('');
    bodyHtml = `
    <div class="sec twocol">
      <div class="panel"><div class="hd"><h4>오늘의 코스</h4></div><div class="mapwrap"><iframe loading="lazy" src="${mapQ}" title="오늘의 코스 지도"></iframe></div></div>
      <div class="panel"><div class="hd"><h4>오늘의 경로</h4><span class="muted" style="font-size:11px">· 누르면 구글 지도</span></div><div class="stoplist">${stopsHtml}</div><a class="ctabtn" href="/old_records">기록에서 자세히 보기 →</a></div>
    </div>
    ${dd.spots.length ? `<div class="sec"><div class="panel"><div class="hd"><h4>오늘 지나는 곳</h4><span class="muted" style="font-size:11px">· 위키백과 사진</span></div><div class="placegrid">${placesHtml}</div></div></div>` : ''}`;
  } else {
    const todo = dd.d.steps.filter(x => x.k === '관광').flatMap(x => x.t.split(/,|·/)).map(t => t.trim()).filter(Boolean);
    bodyHtml = `<div class="sec"><div class="panel restbox"><div class="big">${esc(dd.d.type || '쉬는 날')} · ${esc(dd.stayLabel)}</div>
      ${todo.length ? `<div class="chips">${todo.map(t=>`<span>${esc(t)}</span>`).join('')}</div>` : ''}</div></div>`;
  }

  const hi = hotelInfo(dd.d);
  const hasLodge = hi.ko && hi.ko !== '-' && dd.n < DATA.days.length;
  let tn2 = view + 1; while (tn2 <= DATA.days.length && !DATA.days[tn2-1].km) tn2++;
  const td = tn2 <= DATA.days.length ? dayData(tn2) : null;

  const bottomHtml = (hasLodge || td) ? `
  <div class="sec twocol">
    ${hasLodge ? `<div class="panel lcard"><div class="pic" id="stayimg" style="background-image:none"></div><div class="tx"><div class="lab">오늘 밤 숙소</div><div class="nm">${esc(hi.ko)}</div><div class="nt">${esc(hi.price)}${hi.price&&hi.town?' · ':''}${esc(hi.town)}</div></div></div>` : '<div></div>'}
    ${td ? `<div class="panel nextcard" id="nextcard" style="cursor:pointer"><div class="tx"><div class="lab">${tn2===view+1?'내일':'다음'} 걷는 날 · ${td.n}일차</div><div class="path">${esc(td.title)}</div><div class="km"><b>${td.dist}km</b></div></div><span class="arrow">›</span></div>` : '<div></div>'}
  </div>` : '';

  $('#main').innerHTML = heroHtml + statHtml + bodyHtml + bottomHtml;

  $('#prevDay')?.addEventListener('click', () => goView(view - 1));
  $('#nextDay')?.addEventListener('click', () => goView(view + 1));
  $('#goToday')?.addEventListener('click', () => goView(trueToday));
  $('#hcRefresh')?.addEventListener('click', loadHC);
  $('#nextcard')?.addEventListener('click', () => goView(tn2));

  /* 비동기: 날씨 · 사진 */
  const wd = document.querySelector('[data-wx]');
  $('#hero').dataset.wx = ll(dd.d); $('#hero').dataset.date = isoDay(dateOf(dd.n));
  (async () => {
    const r = await wikiImg(heroQ);
    if (r && $('#hero')) $('#hero').style.backgroundImage = `url(${r.src})`;
  })();
  (async () => {
    const r = await wikiImg(hi.town);
    const el = $('#stayimg'); if (r && el) el.style.backgroundImage = `url(${r.src})`;
  })();
  dd.spots.forEach(([name, q], i) => { (async () => {
    const r = await wikiImg(q); const el = document.getElementById(`pimg-${dd.n}-${i}`);
    if (r && el) { const img = document.createElement('img'); img.src = r.src; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; el.appendChild(img); }
  })(); });
  fillWeatherFor(dd);
}
function mdOf(s){ const d = isoToDate(s); return (d.getMonth()+1)+'/'+d.getDate(); }
async function fillWeatherFor(dd){
  const dt = dateOf(dd.n), diff = Math.round((dt - new Date(new Date().toDateString())) / 864e5);
  const el = $('#wxval'); if (!el) return;
  if (diff > 15 || diff < 0) { el.textContent = '맑음'; return; }
  await fillWeather();
}
function goView(n){ view = Math.min(Math.max(n, 1), DATA.days.length); render(); }

function renderNav(){
  const icons = {
    today: 'M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9L7 23M9.8 8.9l3.2 1.6 1.8 3.5H19M9.8 8.9L6 10.5V14M12.5 15l2.5 3v5',
    rec: 'M3 12h4l2-4 3 8 2-4h7M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10',
    all: 'M4 6h16v14H4zM4 10h16M8 3v5M16 3v5',
    ja: 'M4 5h16v11H9l-5 4zM9 10.5h.01M12 10.5h.01M15 10.5h.01',
    tips: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01'
  };
  const items = [
    ['오늘 일정', icons.today, '#', true],
    ['기록', icons.rec, '/old_records', false],
    ['전체 일정', icons.all, '/old_itinerary', false],
    ['일본어', icons.ja, '/old_japanese', false],
    ['알아둘 것', icons.tips, '/old_guide', false]
  ];
  $('#bottomnav').innerHTML = items.map(([label, d, href, on]) => `<a class="${on?'on':''}" href="${href}"><span class="bar"></span><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"></path></svg></span><span class="lb">${label}</span></a>`).join('');
}

(function(){
  const L={light:['☀','밝게'],dark:['🌙','어둡게'],auto:['◐','자동']}, order=['light','dark','auto'];
  const get=()=>{try{return localStorage.getItem('tk-theme')||'light'}catch(e){return 'light'}};
  const apply=t=>{const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); $('#themeBtn').textContent=L[t][0];};
  apply(get());
  $('#themeBtn').onclick=()=>{const t=order[(order.indexOf(get())+1)%3]; try{localStorage.setItem('tk-theme',t)}catch(e){} apply(t);};
})();

renderNav();
render();
setTimeout(loadHC, 300);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (!HCLAST || Date.now() - (HCLAST.at || 0) > 9e5) loadHC(); });
</script>
</body>
</html>
