<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=880">
<title>東海道 53の休符</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#d62839">
<script>try{var t=localStorage.getItem('tk-theme')||'light';if(t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+JP:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#d9cfb4; --card:#fbf7ec; --cream:#f1e9d2; --line:#e2d8bf;
  --ink:#1b2433; --ink-soft:#3d4350; --ink-faint:#6d6a5f;
  --accent:#d62839; --accent-ink:#a81f2d; --ink2:#1d3557;
  --bar:#e7dec6; --good:#3f7d5a; --nextrow:#fff0ec;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171310; --card:#241f19; --cream:#241f19; --line:#352e24;
  --ink:#f1ece0; --ink-soft:#cfc7b4; --ink-faint:#9e9686;
  --accent:#e85a62; --accent-ink:#f08088; --ink2:#7fa0c8; --bar:#3a3327; --good:#5fae82; --nextrow:#402224; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#171310; --card:#241f19; --cream:#241f19; --line:#352e24;
  --ink:#f1ece0; --ink-soft:#cfc7b4; --ink-faint:#9e9686;
  --accent:#e85a62; --accent-ink:#f08088; --ink2:#7fa0c8; --bar:#3a3327; --good:#5fae82; --nextrow:#402224; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}
button{font-family:inherit}
img{max-width:100%}
.jp{font-family:'Noto Serif JP',serif}
#app{width:880px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:92px;position:relative}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 18px 8px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;white-space:nowrap}
.brand .jp{font-size:12px;color:var(--ink-faint);font-weight:500}
.spacer{flex:1}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}

.hero{position:relative;margin:0 18px;height:268px;border-radius:22px;overflow:hidden;background:#1d3557 center 38%/cover;background-image:var(--heroBg,none)}
.hero .ovtop{position:absolute;left:0;right:0;top:0;height:104px;background:linear-gradient(180deg,rgba(10,16,30,.6) 0%,rgba(10,16,30,.3) 50%,rgba(10,16,30,0) 100%)}
.hero .ovbot{position:absolute;left:0;right:0;bottom:0;height:184px;background:linear-gradient(180deg,rgba(10,16,30,0) 0%,rgba(10,16,30,.45) 26%,rgba(10,16,30,.78) 58%,rgba(10,16,30,.92) 100%)}
.hero .ovrad{position:absolute;inset:0;background:radial-gradient(90% 60% at 18% 62%,rgba(10,16,30,.28),rgba(10,16,30,0) 70%)}
.hero-top{position:absolute;left:14px;right:14px;top:14px;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px}
.wxchip{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 9px;border-radius:12px;background:rgba(251,247,236,.94);white-space:nowrap}
.wxchip .ic{position:relative;width:24px;height:20px;flex:none}
.wxchip .sun{position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#f2b33d}
.wxchip .cloud{position:absolute;right:0;bottom:0;width:18px;height:9px;border-radius:5px;background:#e3e8ec;border:1px solid #c9d1d8}
.wxchip b{font-size:13px;font-weight:800;color:#1b2433}
.wxchip span{font-size:11px;color:#6d6a5f}
.daynav{display:flex;align-items:center;gap:6px}
.daynav button{width:36px;height:36px;border-radius:12px;border:0;background:rgba(251,247,236,.94);color:#1b2433;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.daynav button:disabled{opacity:.4;cursor:default}
.daypill{height:36px;padding:0 14px;border-radius:12px;background:rgba(251,247,236,.94);display:flex;align-items:center;gap:8px;white-space:nowrap}
.daypill b{font-size:14px;font-weight:800;color:var(--accent)}
.daypill span{font-size:13px;font-weight:700;color:#1b2433}
.daypill .tag{font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px}
.todaybtn{height:36px;padding:0 12px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.hero-txt{position:absolute;left:24px;right:24px;bottom:66px;z-index:2;color:#fff}
.hero-txt .jpline{font:500 12.5px 'Noto Serif JP',serif;opacity:.92;letter-spacing:.08em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 8px rgba(8,12,24,.5)}
.hero-txt h2{font-size:27px;font-weight:800;line-height:1.22;letter-spacing:-.02em;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 12px rgba(8,12,24,.45)}
.heropills{display:flex;gap:6px;margin-top:10px}
.heropill{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 10px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);white-space:nowrap}
.heropill svg{flex:none}
.heropill .lab{font-size:11.5px;opacity:.85}
.heropill .val{font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.hero-bar{position:absolute;left:24px;right:24px;bottom:12px;z-index:2;display:flex;align-items:center;gap:12px;color:#fff}
.hero-bar .end{font:700 11.5px 'Noto Serif JP',serif;white-space:nowrap;opacity:.9}
.track{position:relative;flex:1;min-width:0;height:44px}
.track .rail{position:absolute;left:0;right:0;top:22px;height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.45) 0 5px,transparent 5px 10px)}
.track .fill{position:absolute;left:0;top:22px;height:3px;border-radius:2px;background:#fff;transition:width .5s}
.track .mile{position:absolute;top:19px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;border:1.5px solid #fff}
.track .milelabel{position:absolute;top:31px;transform:translateX(-50%);font-size:10px;color:#fff;white-space:nowrap}
.track .pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:2;transition:left .5s}
.track .pin .badge{display:flex;align-items:center;gap:2px;height:17px;padding:0 6px 0 2px;border-radius:9px;background:var(--accent);color:#fff;font-size:9.5px;font-weight:800;white-space:nowrap}
.track .pin .dot2{width:9px;height:9px;margin-top:-1px;border-radius:50%;background:#fff;border:2.5px solid var(--accent)}
.hero-bar .km{font-size:11px;white-space:nowrap;opacity:.85;font-variant-numeric:tabular-nums}

.sec{margin:14px 18px 0}
.sec h3{font-size:14px;font-weight:800;margin:0 0 9px;display:flex;align-items:center;gap:7px}
.sec h3 .aside{font-size:11.5px;color:var(--ink-faint);font-weight:500}
.card{background:var(--card);border-radius:18px}
.statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 13px}
.stat .lab{display:flex;align-items:center;gap:6px;height:18px;font-size:11.5px;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.stat .lab svg{flex:none}
.stat .val{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;margin-top:6px}
.stat .num{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .unit{font-size:11px;font-weight:700;margin-left:2px}
.stat .sub{text-align:right;font-size:10px;line-height:1.3;color:var(--ink-faint);white-space:nowrap}
.stat .sub b{display:block;font-weight:800;color:var(--ink)}
.stat .bar{height:4px;border-radius:2px;background:var(--bar);overflow:hidden;margin-top:8px}
.stat .bar i{display:block;height:100%;border-radius:2px;transition:width .5s}
.hcrow{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-faint);margin-top:8px}
.hcrow button{border:0;background:none;color:var(--accent);font-weight:700;font-size:11.5px;cursor:pointer;padding:0}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.panel{background:var(--card);border-radius:18px;padding:13px 12px 14px;display:flex;flex-direction:column}
.panel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;gap:8px}
.panel .hd h4{font-size:14px;font-weight:800;margin:0;display:flex;align-items:baseline;gap:7px;min-width:0;white-space:nowrap}
.panel .hd .routenote{font-size:11px;color:var(--ink-faint);font-weight:500;overflow:hidden;text-overflow:ellipsis}
.panel .hd a,.panel .hd button{font-size:12px;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer;white-space:nowrap;flex:none}
.mapwrap{position:relative;border-radius:12px;overflow:hidden;background:#e6dcc4;min-height:320px;flex:1}
.leaflet-tile-pane{filter:saturate(.55) sepia(.12)}
.leaflet-container{font-family:'Noto Sans KR',sans-serif;background:#e6dcc4}
.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.7)!important}
.leaflet-tooltip{font:700 11px 'Noto Sans KR',sans-serif;border-radius:8px;border:0;box-shadow:0 2px 8px rgba(12,18,32,.2);color:#1b2433}
.amenchips{position:absolute;left:8px;top:8px;right:8px;z-index:500;display:flex;gap:5px;flex-wrap:wrap}
.amenchips button{height:28px;padding:0 10px 0 6px;border-radius:14px;border:0;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:0 2px 8px rgba(29,53,87,.18)}
.amenchips .g{width:17px;height:17px;border-radius:50%;font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center}
.amennote{font-size:10px;color:#3d4350;background:rgba(255,251,242,.92);padding:3px 8px;border-radius:8px;white-space:nowrap}
.lodgebtn{position:absolute;left:8px;bottom:22px;z-index:500;height:32px;padding:0 11px 0 9px;border-radius:16px;border:0;background:var(--ink2);color:#fff;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(29,53,87,.28)}
.mapbtns{position:absolute;right:8px;bottom:22px;z-index:500;display:flex;flex-direction:column;gap:6px}
.mapbtns button{width:36px;height:36px;border-radius:18px;border:0;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(29,53,87,.22)}
.stoplist{display:flex;flex-direction:column;gap:2px}
.stoplist a{display:flex;align-items:stretch;gap:11px;color:var(--ink);border-radius:12px;padding:0 8px 0 4px}
.stoplist a:hover{background:var(--bg)}
.sdot{width:30px;flex:none;display:flex;flex-direction:column;align-items:center}
.sdot i{width:2px;flex:1;min-height:6px}
.sdot b{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--line)}
.srow{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding:7px 0;gap:2px}
.srow .row1{display:flex;align-items:center;gap:7px}
.srow .nm{font-size:15px;font-weight:700;flex:none}
.srow .jp{font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .meta{flex:none;font-size:12px;font-weight:800;margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .sub{font-size:11px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctarow{display:flex;gap:8px;padding:0 4px;margin-top:10px}
.ctabtn{flex:1;height:48px;border:0;border-radius:24px;font-size:14.5px;font-weight:800;cursor:pointer;white-space:nowrap}

.placegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pcard a{color:inherit}
.pimg{position:relative;height:86px;border-radius:10px;background:var(--bg);overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbadge{position:absolute;left:6px;top:6px;z-index:2;height:20px;padding:0 7px;border-radius:10px;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;white-space:nowrap}
.pname{display:flex;align-items:baseline;gap:5px;margin-top:7px}
.pname b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pdesc{font-size:11.5px;color:var(--ink-faint);margin-top:1px;line-height:1.4}
.plegend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-faint);margin-left:6px}
.plegend .dot{width:8px;height:8px;border-radius:50%}

.lcard{display:flex;gap:12px;align-items:center}
.lcard .pic{width:56px;height:56px;flex:none;border-radius:12px;background:var(--bg) center/cover}
.lcard .tx{flex:1;min-width:0}
.lcard .lab{font-size:11.5px;color:var(--ink-faint)}
.lcard .nm{font-size:14.5px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcard .nm .jp{font-size:11px;color:var(--ink-faint);font-weight:500}
.lcard .nt{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbadge{flex:none;font-size:10.5px;font-weight:700;border-radius:9px;padding:3px 9px;white-space:nowrap}

.nextcard{display:flex;align-items:center;gap:12px}
.nextcard .tx{flex:1;min-width:0}
.nextcard .lab{font-size:11.5px;color:var(--ink-faint)}
.nextcard .path{font-size:13.5px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nextcard .km{font-size:12px;margin-top:2px}
.nextcard .km b{color:var(--accent)}
.nextcard .arrow{font-size:20px;color:var(--ink-faint)}

.restbox{padding:14px 16px}
.restbox .big{font-size:16px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12px;padding:6px 11px;border-radius:14px;background:var(--bg)}

.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:880px;display:flex;padding:0 8px 10px;background:var(--card);box-shadow:0 -1px 0 var(--line);z-index:20}
.bottomnav a{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink-faint);padding:9px 0 2px;text-decoration:none}
.bottomnav a.on{color:var(--accent)}
.bottomnav .bar{width:36px;height:3px;border-radius:0 0 3px 3px;margin-bottom:6px}
.bottomnav a.on .bar{background:var(--accent)}
.bottomnav .pill{width:48px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.bottomnav a.on .pill{background:#f6dcd8}
:root[data-theme="dark"] .bottomnav a.on .pill{background:#402224}
.bottomnav span.lb{font-size:12px;font-weight:600}
.bottomnav a.on span.lb{font-weight:800}

@keyframes tkpulse{0%{box-shadow:0 0 0 0 rgba(214,40,57,.45)}100%{box-shadow:0 0 0 10px rgba(214,40,57,0)}}
@keyframes tkblue{0%{box-shadow:0 0 0 0 rgba(43,107,228,.5)}100%{box-shadow:0 0 0 14px rgba(43,107,228,0)}}
.muted{color:var(--ink-faint)}
.oldlink{display:block;text-align:center;font-size:11.5px;color:var(--ink-faint);margin:18px 18px 0;padding-bottom:2px}

/* ---- 탭 공통 머리/필터 칩 ---- */
.tabhead{padding:34px 18px 0}
.tabhead .eyebrow{font-size:12px;color:var(--ink-faint)}
.tabhead h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 0}
.chiprow{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.chiprow button{flex:none;height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.chiprow button.on{background:var(--ink2);color:#fff;border-color:var(--ink2)}

/* ---- 기록: 역참 스탬프 ---- */
.reccards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:0 18px;margin-top:14px}
.reccard{background:var(--card);border-radius:16px;padding:14px 16px}
.reccard .lab{font-size:12px;font-weight:700;color:var(--ink-soft)}
.reccard .valrow{display:flex;align-items:baseline;gap:4px;margin-top:6px;white-space:nowrap}
.reccard .valrow b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.reccard .valrow span{font-size:12px;color:var(--ink-faint)}
.reccard .bar{height:4px;border-radius:2px;background:var(--bar);margin-top:10px;overflow:hidden}
.reccard .bar i{display:block;height:100%;border-radius:2px}
.stampbox{background:var(--card);border-radius:18px;padding:16px;margin:14px 18px 0}
.stampbox .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.stampbox .hd b{font-size:14px;font-weight:800}
.stampgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.stamp{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:4px}
.stamp.on{background:#f6dcd8;border-color:#efc4bd}
:root[data-theme="dark"] .stamp.on{background:#402224;border-color:#5a3236}
.stamp .ring{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;white-space:pre-line;font:700 11px/1.05 'Noto Serif JP',serif;border:2px solid var(--ink-faint)}
.stamp.on .ring{border-style:solid;border-color:var(--accent);color:var(--accent)}
.stamp:not(.on) .ring{border-style:dashed;color:var(--ink-faint)}
.stamp .nm{font-size:10.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;color:var(--ink-soft)}
.stamp.on .nm{color:var(--accent-ink)}
.rechealth{margin:14px 18px 0}
.rechealth .linkbtn{font-size:12px;font-weight:700;color:var(--accent);background:none;border:0;cursor:pointer}

/* ---- 전체 일정 ---- */
.sched{display:flex;padding-top:32px;height:calc(100vh - 150px);min-height:520px;max-height:800px}
.sched-list{width:300px;flex:none;border-right:1px solid var(--line);padding:0 10px 16px 14px;display:flex;flex-direction:column;min-height:0}
.sched-list .tabhead{padding:0 6px 0 4px}
.sched-list .chiprow{padding:0 6px}
.sched-scroll{flex:1;overflow-y:auto;margin-top:10px;padding-right:2px}
.weekhd{position:sticky;top:0;background:var(--bg);padding:8px 4px 6px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft)}
.weekhd span.rg{font-weight:500;color:var(--ink-faint)}
.dayrow{display:flex;gap:12px;align-items:center;padding:10px 10px;border-radius:14px;cursor:pointer;border:1.5px solid transparent;margin-bottom:5px}
.dayrow:hover{background:var(--card)}
.dayrow.sel{background:var(--card);border-color:var(--ink2)}
.dayrow .dnum{width:36px;flex:none;text-align:center}
.dayrow .dnum .l{font-size:10px;font-weight:700;color:var(--ink-faint)}
.dayrow .dnum .n{font-size:18px;font-weight:800;line-height:1.05}
.dayrow .dtx{flex:1;min-width:0}
.dayrow .dtx .p{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayrow .dtx .m{font-size:11px;color:var(--ink-faint);margin-top:2px;white-space:nowrap}
.dayrow .dbadge{flex:none;font-size:10px;font-weight:700;padding:3px 8px;border-radius:9px;white-space:nowrap}
.sched-detail{flex:1;min-width:0;overflow-y:auto;padding:8px 18px 20px 16px}
.sdcard{background:var(--card);border-radius:20px;overflow:hidden}

<body>
<div id="app">
  <div class="topbar">
    <div class="brand">東海道 <span class="jp">53の休符</span></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="themeBtn" title="밝게/어둡게/자동" aria-label="화면 밝기 바꾸기">◐</button>
  </div>

</div>
<script>
const DATA = /*__DATA__*/null;
const TRIP_START = new Date(2026, 11, 4);
const EXTRA_LL = {1:'35.6285,139.7387',2:'35.6285,139.7387',20:'35.0657,136.6838',28:'34.7967,135.2477',29:'34.7967,135.2477',30:'34.6664,135.5003',31:'34.4347,135.2440'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lines(s){ return String(s || '').split('\n').map(x => x.trim()).filter(Boolean); }
const dateOf = n => { const d = new Date(TRIP_START); d.setDate(d.getDate() + n - 1); return d; };
const isoDay = dt => dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
const isoToDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, k) => { const d = isoToDate(s); d.setDate(d.getDate() + k); return isoDay(d); };
const todayIso = () => isoDay(new Date());
const dowOf = s => '일월화수목금토'[isoToDate(s).getDay()];
function todayN(){ const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate()); return Math.floor((t - TRIP_START) / 864e5) + 1; }
function ll(d){
  if (d.route.length) return d.route[d.route.length - 1].ll;
  if (EXTRA_LL[d.n]) return EXTRA_LL[d.n];
  for (let i = d.n - 2; i >= 0; i--) { const p = DATA.days[i]; if (p.route.length) return p.route[p.route.length - 1].ll; }
  return '35.0,138.5';
}
function parseLL(s){ return String(s).split(',').map(Number); }
function walkedBefore(n){ return DATA.days.filter(d => d.n < n).reduce((s, d) => s + (d.km || 0), 0); }
const GOAL = DATA.days.filter(d => d.n <= 25).reduce((s, d) => s + (d.km || 0), 0);
const MILES = [[4, '하코네'], [10, '시즈오카'], [14, '하마나호'], [19, '나고야'], [22, '스즈카 고개']];
function hotelName(s){ const f = lines(s)[0] || ''; return f.split(/,|·/)[0].replace(/\(.*?\)/g, '').trim(); }
function hotelDay(d){ let hd = d; while ((!hd.h1 || /위와 같음/.test(hd.h1)) && hd.n > 1 && DATA.days[hd.n - 2].stay === d.stay) hd = DATA.days[hd.n - 2]; return hd; }
function hotelInfo(d){ const hd = hotelDay(d), all = lines(hd.h1).join(' '); const m = all.match(/([\d,]+원\/박)/); return { ko: hotelName(hd.h1) || hd.stay, price: m ? m[1] : '', town: hd.stayQ || '', ll: hd.route.length ? hd.route[hd.route.length - 1].ll : ll(d) }; }

/* 도카이도 53역참 (시나가와→교토, 역사적으로 정해진 이름·거리 — 역참 스탬프 계산과 일본어 부제 표시에 사용) */
const STATIONS = ['시나가와','가와사키','가나가와','호도가야','도쓰카','후지사와','히라쓰카','오이소','오다와라','하코네','미시마','누마즈','하라','요시와라','간바라','유이','오키쓰','에지리','후추','마리코','오카베','후지에다','시마다','가나야','닛사카','가케가와','후쿠로이','미쓰케','하마마쓰','마이사카','아라이','시라스카','후타가와','요시다','고유','아카사카','후지카와','오카자키','지류','나루미','미야','구와나','욧카이치','이시야쿠시','쇼노','가메야마','세키','사카시타','쓰치야마','미나쿠치','이시베','구사쓰','오쓰'];
const STATIONS_JP = ['品川','川崎','神奈川','保土ヶ谷','戸塚','藤沢','平塚','大磯','小田原','箱根','三島','沼津','原','吉原','蒲原','由比','興津','江尻','府中','丸子','岡部','藤枝','島田','金谷','日坂','掛川','袋井','見附','浜松','舞阪','新居','白須賀','二川','吉田','御油','赤坂','藤川','岡崎','池鯉鮒','鳴海','宮','桑名','四日市','石薬師','庄野','亀山','関','坂下','土山','水口','石部','草津','大津'];
function jpOf(name){
  if (!name) return '';
  for (let i = 0; i < STATIONS.length; i++) { const s = STATIONS[i]; if (s.length >= 2 && (name.includes(s) || s.includes(name))) return STATIONS_JP[i]; }
  return '';
}

/* 사진: 위키백과 검색 (키 없음, 기존 사이트와 같은 방식) */
const PHOTO_CACHE = {};
function cacheGet(k){ if (PHOTO_CACHE[k]) return PHOTO_CACHE[k]; try { const v = sessionStorage.getItem('ph:' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function cacheSet(k, v){ PHOTO_CACHE[k] = v; try { sessionStorage.setItem('ph:' + k, JSON.stringify(v)); } catch(e){} }
async function wikiImg(q){
  const k = 'w:' + q; const c = cacheGet(k); if (c) return c;
  const u = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages|info&piprop=thumbnail&pithumbsize=700&inprop=url&gsrsearch=' + encodeURIComponent(q);
  try { const j = await (await fetch(u)).json();
    const ps = Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index).filter(p => p.thumbnail);
    const r = ps.length ? { src: ps[0].thumbnail.source, href: ps[0].fullurl } : null;
    cacheSet(k, r); return r;
  } catch(e){ return null; }
}

/* 삼성 헬스 (HC Webhook → Supabase) */
const HC_URL = 'https://jmfvsusybouibqmdvtmy.supabase.co/functions/v1/hc-read';
let HCKEY = ''; try { HCKEY = localStorage.getItem('tk-hckey') || ''; } catch(e){}
(function(){ const m = location.hash.match(/[#&]k=([\w-]+)/); if (m) { HCKEY = m[1]; try { localStorage.setItem('tk-hckey', HCKEY); } catch(e){} history.replaceState(null, '', location.pathname); } })();
let HCD = {}, HCLAST = null; try { const c = JSON.parse(localStorage.getItem('tk-hc2') || 'null'); if (c) { HCD = c.byDate || {}; HCLAST = c; } } catch(e){}
let HCSTATE = HCKEY ? 'wait' : 'off';
async function loadHC(){
  if (!HCKEY || !navigator.onLine) return;
  const to = todayIso(); let from = addDays(to, -119); const ts = isoDay(TRIP_START); if (to >= ts && ts < from) from = ts;
  try {
    const res = await fetch(`${HC_URL}?from=${from}&to=${to}`, { headers: { 'x-read-key': HCKEY }, cache: 'no-store' });
    if (res.status === 401) { HCSTATE = 'badkey'; return; }
    if (!res.ok) throw 0;
    const j = await res.json(), out = {};
    Object.entries(j.days || {}).forEach(([k, s]) => { if (!(s.steps || s.km || s.min)) return;
      out[k] = { km: Math.max(+s.km || 0, +s.exKm || 0), steps: s.steps || 0, min: s.min ?? null, kcal: s.kcal ?? s.kcalActive ?? null }; });
    HCD = out; HCSTATE = 'ok';
    HCLAST = { byDate: out, last: j.last, today: (j.days || {})[to] || null, at: Date.now() };
    try { localStorage.setItem('tk-hc2', JSON.stringify(HCLAST)); } catch(e){}
    renderApp();
  } catch(e){ HCSTATE = 'err'; }
}

/* 날씨: Open-Meteo (무료, 키 없음) */
const WX_CACHE = {};
async function fillWeatherFor(llStr, dateIso, fallbackLabel){
  const el = $('#wxval'), sub = $('#wxsub'); if (!el) return;
  const dt = isoToDate(dateIso), diff = Math.round((dt - new Date(new Date().toDateString())) / 864e5);
  if (diff > 15 || diff < 0) { el.textContent = '-'; if (sub) sub.textContent = fallbackLabel || ''; return; }
  const [la, lo] = llStr.split(','), key = llStr + dateIso;
  try {
    const j = WX_CACHE[key] || (WX_CACHE[key] = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunset&timezone=Asia%2FTokyo&start_date=${dateIso}&end_date=${dateIso}`)).json());
    const t = j.daily; if (!t || !t.time || !t.time.length) return;
    const hi = Math.round(t.temperature_2m_max[0]), lo2 = Math.round(t.temperature_2m_min[0]), pr = t.precipitation_probability_max[0];
    const code = t.weathercode ? t.weathercode[0] : null;
    const sset = t.sunset ? new Date(t.sunset[0]) : null;
    el.textContent = `${lo2}° / ${hi}°`;
    const sunEl = $('#wxsun'); if (sunEl) sunEl.style.background = (code != null && code > 2) ? '#c9d1d8' : '#f2b33d';
    if (sub) sub.textContent = `강수 ${pr ?? '-'}%${sset ? ` · 일몰 ${String(sset.getHours()).padStart(2,'0')}:${String(sset.getMinutes()).padStart(2,'0')}` : ''}`;
  } catch(e){}
}

/* ---- 일차별 데이터 가공 ---- */
function dayData(n){
  const d = DATA.days[n - 1];
  const stops = d.route.map((r, i) => ({ name: r.name.replace(/\s*\(숙소\)\s*/, ''), hotel: /\(숙소\)/.test(r.name), ll: r.ll, rel: d.nodes[i] ?? 0 }));
  const first = stops[0], last = stops[stops.length - 1];
  const stayLabel = d.stay && d.stay !== '-' ? d.stay : (d.type || d.region || '');
  const title = d.walkSeg ? d.walkSeg.replace(/\s*\(.*?\)\s*/g, ' ').trim() : (first && last ? `${first.name} → ${last.name}` : stayLabel);
  const jpTitle = stops.map(s => jpOf(s.name)).filter(Boolean).join(' → ');
  const spots = (d.photos && d.photos.s || []).slice(0, 4);
  return { n, d, stops, dist: d.km || 0, title, jpTitle, stayLabel, summary: d.km ? `${d.km} km · 지점 ${stops.length}곳` : (d.type || ''), spots };
}
function stationsThru(n, frac){
  let done = 0;
  for (let i = 0; i < n - 1; i++) { const m = DATA.days[i].stations.map(s => parseInt(s)).filter(Boolean); if (m.length) done = Math.max(done, Math.max(...m)); }
  const here = DATA.days[n - 1].stations.map(s => parseInt(s)).filter(Boolean);
  if (here.length) done = Math.max(done, done + Math.round((Math.max(...here) - done) * frac));
  return Math.min(53, done);
}
function lodgeOkKey(n){ return 'tk-lodgeok-' + n; }
function getLodgeOk(n){ try { return localStorage.getItem(lodgeOkKey(n)) === '1'; } catch(e){ return false; } }
function setLodgeOk(n, v){ try { localStorage.setItem(lodgeOkKey(n), v ? '1' : '0'); } catch(e){} }
function visGet(){ try { return JSON.parse(localStorage.getItem('tk-visit') || '{}'); } catch(e){ return {}; } }
function visSet(o){ try { localStorage.setItem('tk-visit', JSON.stringify(o)); } catch(e){} }
let stFilter = 'all', schedFilter = 'all', langCat = '전체', langIdx = 0, langCopied = false;

/* ---- 아이콘 ---- */
const ICON = {
  pin: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21zM12 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"></path></svg>',
  flag: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>',
  foot: '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M8 3.5c1.7 0 3 2 3 4.5s-1.3 4.5-3 4.5-3-2-3-4.5 1.3-4.5 3-4.5zM8 15c1.2 0 2.2.7 2.2 1.6S9.2 18.2 8 18.2s-2.2-.7-2.2-1.6S6.8 15 8 15zM16 6.5c1.7 0 3 2 3 4.5s-1.3 4.5-3 4.5-3-2-3-4.5 1.3-4.5 3-4.5zM16 18c1.2 0 2.2.7 2.2 1.6s-1 1.6-2.2 1.6-2.2-.7-2.2-1.6S14.8 18 16 18z"></path></svg>',
  clock: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"></path></svg>',
  house: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-5h4v5"></path></svg>',

function loadRoute(dd, ctx){

      const lineBot = en ? 'transparent' : (past || i < reached) ? 'var(--good)' : 'var(--line)';
      const sub = en ? `숙소 · ${esc(hi.ko)}` : '';
      return `<a href="https://www.google.com/maps/search/?api=1&query=${s.ll}" target="_blank" rel="noopener" style="${nxt ? 'background:var(--nextrow);box-shadow:inset 0 0 0 1.5px var(--accent)' : ''}">
        <div class="sdot"><i style="background:${lineTop}"></i><b style="background:${dotBg};border-color:${dotBg};color:${dotColor};font-size:${end?10:12}px;${nxt?'animation:tkpulse 1.6s ease-out infinite':''}">${label}</b><i style="background:${lineBot}"></i></div>

    }).join('');

    else if (!isToday) { ctaLabel = `${view}일차 · 아직 시작 전`; ctaBg = 'var(--bar)'; ctaColor = 'var(--ink-soft)'; ctaCursor = 'default'; ctaClick = ''; }
    else if (doneAll) { ctaLabel = '오늘 일정 완료 ✓'; ctaBg = 'var(--ink2)'; }
    else if (walkedKm <= 0) { ctaLabel = HCKEY ? '삼성 헬스 기록 받아오기' : '삼성 헬스 연결하기'; }
    else { const ns = dd.stops[Math.min(reached+1, n-1)]; ctaLabel = `${ns.name}까지 ${(ns.rel - walkedKm).toFixed(1)}km 남음 · 새로고침`; }

    const legend = `<span class="plegend"><span class="dot" style="background:var(--good)"></span>지나온 곳</span><span class="plegend"><span class="dot" style="background:var(--accent)"></span>다음 장소</span>`;
    let firstUpIdx = -1;
    const placeInfo = dd.spots.map(([name, q]) => {
      const hit = dd.stops.find(s => s.name.length >= 3 && (name.includes(s.name) || s.name.includes(name)));
      const rel = hit ? hit.rel : null;
      const passed = isPast || (isToday && rel != null && rel <= viewWalkedKm + 0.05);
      return { name, q, rel, passed };
    });
    placeInfo.forEach((p, i) => { if (!p.passed && firstUpIdx < 0 && p.rel != null) firstUpIdx = i; });
    const placesHtml = placeInfo.map((p, i) => {
      const isNext = isToday && i === firstUpIdx;
      const ahead = p.rel != null ? (p.rel - viewWalkedKm).toFixed(1) : null;
      const badge = p.passed ? '✓ 지나옴' : isNext ? `다음 · ${ahead}km` : (ahead != null ? `${ahead}km 앞` : '경유지');
      const badgeBg = p.passed ? 'var(--good)' : isNext ? 'var(--accent)' : 'rgba(29,53,87,.88)';
      return `<div class="pcard"><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.q)}" target="_blank" rel="noopener">
        <div class="pimg" id="pimg-${dd.n}-${i}" style="${p.passed?'filter:grayscale(1);opacity:.55':''}"><div class="pnum pbadge" style="background:${badgeBg}">${badge}</div></div>
        <div class="pname"><b style="color:${p.passed?'var(--ink-faint)':'var(--ink)'}">${i+1}. ${esc(p.name)}</b></div></a></div>`;
    }).join('');

    bodyHtml = `
    <div class="sec twocol">
      <div class="panel"><div class="hd"><h4>오늘의 코스 <span class="routenote" id="routeNote">경로 불러오는 중…</span></h4><a href="${gmapsDir}" target="_blank" rel="noopener">구글 지도 길찾기 ›</a></div>
        <div class="mapwrap">
          <div id="mapview" style="position:absolute;inset:0"></div>

            <div style="flex-basis:100%;height:0"></div><span class="amennote" id="amenNote">주변 시설 확인 중…</span></div>
          <button class="lodgebtn" id="lodgeFly">${ICON.house}숙소 위치</button>
          <div class="mapbtns"><button id="fitRouteBtn" title="전체 경로">${ICON.fit}</button><button id="locateBtn" title="현재 위치">${ICON.locate}</button></div>
        </div>
      </div>
      <div class="panel"><div class="hd"><h4>오늘의 경로</h4><span class="muted" style="font-size:11px">· 누르면 구글 지도</span></div>
        <div class="stoplist">${stopsHtml}</div>
        <div class="ctarow"><button class="ctabtn" id="ctaBtn" style="background:${ctaBg};color:${ctaColor};cursor:${ctaCursor}">${esc(ctaLabel)}</button></div>
      </div>
    </div>
    ${dd.spots.length ? `<div class="sec"><div class="panel"><div class="hd"><h4>오늘 지나는 곳</h4><span class="muted" style="font-size:11px">· 사진을 누르면 지도로</span>${legend}</div><div class="placegrid">${placesHtml}</div></div></div>` : ''}`;
  } else {
    const todo = dd.d.steps.filter(x => x.k === '관광').flatMap(x => x.t.split(/,|·/)).map(t => t.trim()).filter(Boolean);
    bodyHtml = `<div class="sec"><div class="panel restbox"><div class="big">${esc(dd.d.type || '쉬는 날')} · ${esc(dd.stayLabel)}</div>
      ${todo.length ? `<div class="chips">${todo.map(t=>`<span>${esc(t)}</span>`).join('')}</div>` : ''}</div></div>`;
  }

  const hasLodge = hi.ko && hi.ko !== '-' && dd.n < DATA.days.length;
  let tn2 = view + 1; while (tn2 <= DATA.days.length && !DATA.days[tn2-1].km) tn2++;
  const td = tn2 <= DATA.days.length ? dayData(tn2) : null;
  const lodgeOk = getLodgeOk(dd.n);
  const lodgeLabel = isPast ? '숙박 완료' : lodgeOk ? '확정' : '후보';
  const lodgeBg = isPast ? 'var(--bar)' : lodgeOk ? 'var(--ink2)' : 'var(--bar)';
  const lodgeColor = isPast ? 'var(--ink-soft)' : lodgeOk ? '#fff' : 'var(--ink-soft)';

  const bottomHtml = (hasLodge || td) ? `
  <div class="sec twocol">
    ${hasLodge ? `<div class="panel lcard" id="lodgeCard" style="cursor:${isPast?'default':'pointer'}"><div class="pic" id="stayimg" style="background-image:none"></div><div class="tx"><div class="lab">오늘 밤 숙소</div><div class="nm">${esc(hi.ko)}</div><div class="nt">${esc(hi.price)}${hi.price&&hi.town?' · ':''}${esc(hi.town)}</div></div><span class="lbadge" style="background:${lodgeBg};color:${lodgeColor}">${lodgeLabel}</span></div>` : '<div></div>'}
    ${td ? `<div class="panel nextcard" id="nextcard" style="cursor:pointer"><div class="tx"><div class="lab">${tn2===view+1?'내일':'다음'} 걷는 날 · ${td.n}일차${td.d.start?' · '+esc(td.d.start)+' 출발':''}</div><div class="path">${esc(td.title)}</div><div class="km"><b>${td.dist}km</b></div></div><span class="arrow">›</span></div>` : '<div></div>'}
  </div>` : '';

  $('#main').innerHTML = heroHtml + statHtml + bodyHtml + bottomHtml;

  $('#prevDay')?.addEventListener('click', () => goView(view - 1));
  $('#nextDay')?.addEventListener('click', () => goView(view + 1));
  $('#goToday')?.addEventListener('click', () => goView(trueToday));
  $('#hcRefresh')?.addEventListener('click', loadHC);
  $('#nextcard')?.addEventListener('click', () => goView(tn2));
  if (isToday && walkDay) $('#ctaBtn')?.addEventListener('click', loadHC);
  if (hasLodge && !isPast) $('#lodgeCard')?.addEventListener('click', () => { setLodgeOk(dd.n, !lodgeOk); renderApp(); });

  if (walkDay) {
    const ctx = { isPast, isToday, reached, doneAll };
    document.getElementById('amenChips')?.querySelectorAll('button[data-amen]').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.amen, amC = AMENCACHE[dd.n]; if (!amC || !(amC[k]||[]).length) return;
        const on = AMENON[dd.n] || (AMENON[dd.n] = {}); on[k] = !on[k]; renderAmenChips(dd.n); drawMap(dd, ctx);
      });
    });
    $('#fitRouteBtn')?.addEventListener('click', () => fitBoundsSafe(routePts(dd)));
    $('#lodgeFly')?.addEventListener('click', () => { if (MAP) try { MAP.flyTo(parseLL(dd.stops[n-1].ll), 16, { duration:.6 }); } catch(e){} });
    $('#locateBtn')?.addEventListener('click', () => {
      if (!MAP) return;
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
        pos => { try { MAP.flyTo([pos.coords.latitude, pos.coords.longitude], 16, { duration:.6 }); } catch(e){} },
        () => fitBoundsSafe(routePts(dd)), { timeout:4000, maximumAge:60000 });
      else fitBoundsSafe(routePts(dd));
    });
    initMap(dd, ctx);
  }

  /* 비동기: 날씨 · 사진 */
  fillWeatherFor(ll(dd.d), isoDay(dateOf(dd.n)), stateLabel);
  (async () => { const r = await wikiImg(heroQ); if (r && $('#hero')) $('#hero').style.backgroundImage = `url(${r.src})`; })();
  (async () => { const r = await wikiImg(hi.town); const el = $('#stayimg'); if (r && el) el.style.backgroundImage = `url(${r.src})`; })();
  dd.spots.forEach(([name, q], i) => { (async () => {
    const r = await wikiImg(q); const el = document.getElementById(`pimg-${dd.n}-${i}`);
    if (r && el) { const img = document.createElement('img'); img.src = r.src; img.loading = 'lazy'; img.referrerPolicy = 'no-referrer'; img.style.position='absolute'; img.style.inset='0'; img.style.width='100%'; img.style.height='100%'; img.style.objectFit='cover'; el.insertBefore(img, el.firstChild); }
  })(); });
}
/* ---- 기록: 역참 스탬프 + 실제 운동 기록 ---- */
function renderRecord(){
  const tn = todayN(), hasTrip = tn >= 1 && tn <= DATA.days.length;
  const todayIsoKey = todayIso();
  const hc = HCD[todayIsoKey] || null;
  const todayTarget = (hasTrip && DATA.days[tn - 1].km > 0) ? DATA.days[tn - 1].km : 0;
  const walkedKm = hc ? Math.min(todayTarget || Infinity, hc.km || 0) : 0;
  const autoThru = stationsThru(hasTrip ? tn : 1, todayTarget ? walkedKm / todayTarget : 0);
  const overrides = visGet();
  const isVisited = i => overrides[i] != null ? !!overrides[i] : i < autoThru;
  const visitedCount = STATIONS.reduce((s, _, i) => s + (isVisited(i) ? 1 : 0), 0);

  let doneDays = 0;
  DATA.days.forEach(d => { if (!d.km || d.n >= tn) return; const k = isoDay(dateOf(d.n)); const r = HCD[k]; if (r && (r.km || 0) >= d.km * 0.9) doneDays++; });
  const totalWalkDays = DATA.days.filter(d => d.km > 0).length || 1;
  const posKm = walkedBefore(hasTrip ? tn : 1) + (hasTrip ? walkedKm : 0);

  const cards = [
    { label: '누적 거리', value: Math.round(posKm), unit: `/ ${Math.round(GOAL)} km`, pct: Math.round(posKm / GOAL * 100), color: 'var(--accent)' },
    { label: '완주한 날', value: doneDays, unit: `/ ${totalWalkDays}일`, pct: Math.round(doneDays / totalWalkDays * 100), color: 'var(--ink2)' },
    { label: '역참 스탬프', value: visitedCount, unit: '/ 53', pct: Math.round(visitedCount / 53 * 100), color: 'var(--accent)' }
  ];
  const segs = [['all', '전체'], ['on', '방문'], ['off', '미방문']];
  const stM = { all: () => true, on: v => v, off: v => !v };
  const stampsHtml = STATIONS.map((ko, i) => {
    const v = isVisited(i); if (!stM[stFilter](v)) return '';
    const jp = STATIONS_JP[i], jpLabel = jp.length > 3 ? jp.slice(0, 2) + '\n' + jp.slice(2) : jp, fs = jp.length >= 3 ? 10.5 : 13;
    return `<button class="stamp ${v ? 'on' : ''}" data-i="${i}"><div class="ring" style="font-size:${fs}px">${esc(jpLabel)}</div><div class="nm">${i + 1}. ${esc(ko)}</div></button>`;
  }).join('');

  $('#main').innerHTML = `
  <div class="tabhead"><div class="eyebrow">역참을 누르면 스탬프를 찍거나 지울 수 있어요</div><h2>기록</h2></div>
  <div class="reccards">${cards.map(c => `<div class="reccard"><div class="lab">${esc(c.label)}</div><div class="valrow"><b style="color:${c.color}">${c.value}</b><span>${esc(c.unit)}</span></div><div class="bar"><i style="width:${Math.min(100, Math.max(0, c.pct))}%;background:${c.color}"></i></div></div>`).join('')}</div>
  ${healthStatBlock()}
  <div class="stampbox">
    <div class="hd"><b>53역참 스탬프</b><div class="chiprow" style="margin:0">${segs.map(([k, l]) => `<button class="${stFilter === k ? 'on' : ''}" data-stf="${k}">${l}</button>`).join('')}</div></div>
    <div class="stampgrid">${stampsHtml}</div>
  </div>
  <div class="rechealth"><button class="linkbtn" id="toOldRecords">체중 변화 · 기념 배지 더 보기 ›</button></div>`;

  $('#hcRefresh')?.addEventListener('click', loadHC);
  $('#toOldRecords')?.addEventListener('click', () => location.href = '/old_records');
  $('#main').querySelectorAll('button[data-stf]').forEach(b => b.addEventListener('click', () => { stFilter = b.dataset.stf; renderRecord(); }));
  $('#main').querySelectorAll('button.stamp').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i; const o = visGet(); o[i] = !isVisited(i); visSet(o); renderRecord();
  }));
}

/* ---- 전체 일정 ---- */
function renderSchedule(){
  const tn = todayN();
  const dd = dayData(view);
  const fm = { all: () => true, done: n => n < tn, today: n => n === tn, plan: n => n > tn };
  const statusOf = n => n < tn ? ['완료', 'var(--bar)', 'var(--ink-soft)'] : n === tn ? ['오늘', 'var(--accent)', '#fff'] : ['예정', 'transparent', 'var(--ink-faint)'];
  const filters = [['all', '전체'], ['done', '완료'], ['today', '오늘'], ['plan', '예정']];

  const groups = [];
  for (let w = 0; w < 5; w++) {
    const rows = [];
    for (let n = w * 7 + 1; n <= Math.min(DATA.days.length, w * 7 + 7); n++) {
      if (!fm[schedFilter](n)) continue;
      const x = dayData(n), [st, bb, bc] = statusOf(n);
      rows.push({ n, path: x.title, date: `${x.d.date} (${x.d.dow})`, dist: x.dist, st, bb, bc });
    }
    if (!rows.length) continue;
    const a = rows[0].n, b = rows[rows.length - 1].n;
    groups.push({ label: `${w + 1}주차`, range: `${DATA.days[a - 1].date} – ${DATA.days[Math.min(b, DATA.days.length) - 1].date}`, rows });
  }

  const hi = hotelInfo(dd.d);
  const sdStats = [{ l: '거리', v: dd.dist + ' km' }, { l: '예상 시간', v: dd.d.wt ? String(dd.d.wt) : '-' }, { l: '누적', v: Math.round(walkedBefore(dd.n) + dd.dist) + ' km' }];
  const dIso = isoDay(dateOf(dd.n)), dr = HCD[dIso];
  const sdActual = dd.n <= tn
    ? [{ l: '걸은 거리', v: dr ? (+dr.km || 0).toFixed(1) + ' km' : (dd.n === tn ? '0.0 km' : '—') },
       { l: '걸은 시간', v: dr && dr.min ? Math.floor(dr.min / 60) + '시간 ' + String(dr.min % 60).padStart(2, '0') + '분' : '—' },
       { l: '걸음 수', v: dr && dr.steps ? dr.steps.toLocaleString('ko-KR') + '보' : (dd.n === tn ? '0보' : '—') }]
    : [{ l: '걸은 거리', v: '—' }, { l: '걸은 시간', v: '—' }, { l: '걸음 수', v: '—' }];
  const sdNote = dd.n > tn ? '걷고 나면 기록돼요' : dd.n === tn ? ((dr && dr.km > 0) ? '지금까지' : '아직 출발 전') : '완주';
  const [sdStatus, sdBg, sdColor] = statusOf(dd.n);
  const heroQ = dd.spots[0] ? dd.spots[0][1] : (dd.d.stayQ || dd.d.stay);

  $('#main').innerHTML = `
  <div class="sched">
    <section class="sched-list">
      <div class="tabhead"><div class="eyebrow">한 달, 53개의 역참을 따라</div><h2>전체 일정</h2>
      <div class="chiprow">${filters.map(([k, l]) => `<button class="${schedFilter === k ? 'on' : ''}" data-schf="${k}">${l}</button>`).join('')}</div></div>
      <div class="sched-scroll">
        ${groups.map(g => `<div class="weekhd"><span>${g.label}</span><span class="rg">${g.range}</span></div>
          ${g.rows.map(r => `<div class="dayrow ${r.n === view ? 'sel' : ''}" data-day="${r.n}">
            <div class="dnum"><div class="l">DAY</div><div class="n" style="color:${r.n === tn ? 'var(--accent)' : r.n < tn ? 'var(--ink-faint)' : 'var(--ink)'}">${r.n}</div></div>
            <div class="dtx"><div class="p">${esc(r.path)}</div><div class="m">${esc(r.date)} · ${r.dist}km</div></div>
            <span class="dbadge" style="background:${r.bb};color:${r.bc}">${r.st}</span>
          </div>`).join('')}`).join('')}
      </div>
    </section>
    <section class="sched-detail">
      <div class="sdcard">
        <div class="sdhero" id="sdHero"><div class="ov"></div><div class="tx"><div class="row"><b style="background:${sdBg};color:${sdColor}">${sdStatus}</b><span>${dd.n}일차 · ${esc(dd.d.date)} (${esc(dd.d.dow)})</span></div><h3>${esc(dd.title)}</h3>${dd.jpTitle ? `<div class="jp">${esc(dd.jpTitle)}</div>` : ''}</div></div>
        <div class="sdbody">
          <div class="sdgrid">${sdStats.map(x => `<div class="c"><div class="l">${esc(x.l)}</div><div class="v">${esc(x.v)}</div></div>`).join('')}</div>
          <div class="sdlab"><b>실제 기록</b><span>${sdNote}</span></div>
          <div class="sdgrid">${sdActual.map(x => `<div class="c b"><div class="l">${esc(x.l)}</div><div class="v" style="color:${x.v === '—' ? 'var(--ink-faint)' : 'var(--accent)'}">${esc(x.v)}</div></div>`).join('')}</div>
          ${dd.stops.length ? `<div class="sdlab"><b>경유지</b></div><div class="sdstops">${dd.stops.map((s, i) => `<div class="r"><span class="no" style="background:${i === 0 || i === dd.stops.length - 1 ? 'var(--ink2)' : 'var(--ink-faint)'}">${i === 0 ? '출' : i === dd.stops.length - 1 ? '도' : i}</span><span class="nm">${esc(s.name)}</span><span class="jp">${esc(jpOf(s.name))}</span><span class="rel">${s.rel} km</span></div>`).join('')}</div>` : ''}
          <div class="sdlodge"><div><div class="l">숙박</div><div class="n">${esc(hi.ko)} <span class="jp">${esc(jpOf(hi.ko))}</span></div></div><span class="dbadge" style="background:var(--bar);color:var(--ink-soft)">${dd.n < tn ? '숙박 완료' : getLodgeOk(dd.n) ? '확정' : '후보'}</span></div>
          <div class="sdbtns">
            <button class="nav" id="sdPrev" ${dd.n <= 1 ? 'disabled' : ''}>‹</button>
            <button class="go" id="sdOpen">이 날 자세히 보기</button>
            <button class="nav" id="sdNext" ${dd.n >= DATA.days.length ? 'disabled' : ''}>›</button>
          </div>
        </div>
      </div>
    </section>
  </div>`;

  $('#main').querySelectorAll('button[data-schf]').forEach(b => b.addEventListener('click', () => { schedFilter = b.dataset.schf; renderSchedule(); }));
  $('#main').querySelectorAll('.dayrow[data-day]').forEach(el => el.addEventListener('click', () => { view = +el.dataset.day; renderSchedule(); }));
  $('#sdPrev')?.addEventListener('click', () => { view = Math.max(1, dd.n - 1); renderSchedule(); });
  $('#sdNext')?.addEventListener('click', () => { view = Math.min(DATA.days.length, dd.n + 1); renderSchedule(); });
  $('#sdOpen')?.addEventListener('click', () => setTab('today'));
  (async () => { const r = await wikiImg(heroQ); const el = $('#sdHero'); if (r && el) el.style.backgroundImage = `url(${r.src})`; })();
}

/* ---- 지도(전체화면) ---- */

  if (!L) { setTimeout(() => initSingleMap(ptStr), 150); return; }
  const el = document.getElementById('mapview'); if (!el) return;
  destroyMap();
  try {
    const map = L.map(el, { zoomControl: false, scrollWheelZoom: false });
    L.tileLayer(GSI_TILE, { attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>', maxZoom: 18 }).addTo(map);
    MAP = map; MAPSVG = L.svg({ padding: .5 }).addTo(map); MAPLAY = L.layerGroup().addTo(map);
    const pt = parseLL(ptStr);
    map.setView(pt, 14);
    try { L.marker(pt, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: pinHtml(ICON.house, '#1d3557', '#fff', '#fff', 8) }), zIndexOffset: 300 }).addTo(MAPLAY); } catch(e){}
  } catch(e){}
}
function renderMapTab(){
  const dd = dayData(view), tn = todayN();
  const isToday = view === tn, isPast = view < tn;
  const walkDay = dd.dist > 0, n = dd.stops.length;
  const todayIsoKey = todayIso();
  const hc = HCD[todayIsoKey] || null;
  const todayTarget = (tn >= 1 && tn <= DATA.days.length && DATA.days[tn - 1].km > 0) ? DATA.days[tn - 1].km : 8;
  const walkedKm = hc ? Math.min(todayTarget, hc.km || 0) : 0;
  const viewWalkedKm = isPast ? dd.dist : isToday ? walkedKm : 0;
  let reached = -1;
  if (walkDay && (isPast || viewWalkedKm > 0)) for (let i = 0; i < n; i++) if (dd.stops[i].rel <= viewWalkedKm + 0.05) reached = i;
  const doneAll = walkDay && reached >= n - 1;

  $('#main').innerHTML = `
  <div class="fullmap">
    <div class="top">
      <div class="navpill">
        <button id="mPrev" ${view <= 1 ? 'disabled' : ''}>‹</button>
        <div class="tx"><div class="d1">${dd.n}일차 · ${esc(dd.d.date)} (${esc(dd.d.dow)}) <span id="routeNote" style="font-weight:500;color:var(--ink-faint)"></span></div><div class="d2">${esc(dd.title)}${walkDay ? ` · ${dd.dist}km` : ''}</div></div>
        <button id="mNext" ${view >= DATA.days.length ? 'disabled' : ''}>›</button>
      </div>
      ${walkDay ? `<div class="amenchips" style="position:static" id="amenChips">${AMEN.map(a => `<button data-amen="${a[0]}"><span class="g">${a[2]}</span>${a[1]}<b style="opacity:.7;margin-left:3px">…</b></button>`).join('')}<span class="amennote" id="amenNote">주변 시설 확인 중…</span></div>` : ''}
    </div>
    <div id="mapview" style="position:absolute;inset:0"></div>
    ${walkDay ? `<button class="lodgebtn" id="lodgeFly">${ICON.house}숙소 위치</button><div class="mapbtns"><button id="fitRouteBtn" title="전체 경로">${ICON.fit}</button><button id="locateBtn" title="현재 위치">${ICON.locate}</button></div>` : ''}
  </div>`;

  $('#mPrev')?.addEventListener('click', () => { view = Math.max(1, view - 1); renderApp(); });
  $('#mNext')?.addEventListener('click', () => { view = Math.min(DATA.days.length, view + 1); renderApp(); });

  if (walkDay) {
    const ctx = { isPast, isToday, reached, doneAll };
    document.getElementById('amenChips')?.querySelectorAll('button[data-amen]').forEach(btn => {
      btn.addEventListener('click', () => {
        const k = btn.dataset.amen, amC = AMENCACHE[dd.n]; if (!amC || !(amC[k] || []).length) return;
        const on = AMENON[dd.n] || (AMENON[dd.n] = {}); on[k] = !on[k]; renderAmenChips(dd.n); drawMap(dd, ctx);
      });
    });
    $('#fitRouteBtn')?.addEventListener('click', () => fitBoundsSafe(routePts(dd)));
    $('#lodgeFly')?.addEventListener('click', () => { if (MAP) try { MAP.flyTo(parseLL(dd.stops[n - 1].ll), 16, { duration: .6 }); } catch(e){} });
    $('#locateBtn')?.addEventListener('click', () => {
      if (!MAP) return;
      if (navigator.geolocation) navigator.geolocation.getCurrentPosition(
        pos => { try { MAP.flyTo([pos.coords.latitude, pos.coords.longitude], 16, { duration: .6 }); } catch(e){} },
        () => fitBoundsSafe(routePts(dd)), { timeout: 4000, maximumAge: 60000 });
      else fitBoundsSafe(routePts(dd));
    });
    initMap(dd, ctx);
  } else {
    initSingleMap(ll(dd.d));
  }
}

/* ---- 일본어 ---- */
function renderLang(){
  const list = DATA.ja || [];
  const cats = ['전체', ...Array.from(new Set(list.map(p => p.cat)))];
  const idxs = list.map((_, i) => i).filter(i => langCat === '전체' || list[i].cat === langCat);
  const curI = idxs.includes(langIdx) ? langIdx : (idxs[0] ?? 0);
  const p = list[curI] || {};
  $('#main').innerHTML = `
  <div class="lang">
    <section class="lang-list">
      <div class="tabhead"><div class="eyebrow">누르면 오른쪽에 크게 보여요</div><h2>일본어</h2>
      <div class="chiprow">${cats.map(c => `<button class="${langCat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
      <div class="lang-scroll">${idxs.map(i => `<div class="phraserow ${i === curI ? 'sel' : ''}" data-i="${i}"><div class="jp">${esc(list[i].ja)}</div><div class="ko">${esc(list[i].ko)}</div></div>`).join('')}</div>
    </section>
    <section class="lang-detail">
      <div class="phrasecard">
        <span class="cat">${esc(p.cat || '')}${p.sit ? ' · ' + esc(p.sit) : ''}</span>
        <div class="mid">
          <div class="jp">${esc(p.ja || '')}</div>
          <div class="pr">${esc(p.pr || '')}</div>
          <div class="ko">${esc(p.ko || '')}</div>
          ${p.tip ? `<div style="font-size:12px;opacity:.75">${esc(p.tip)}</div>` : ''}
        </div>
        <div class="btns"><button class="copy" id="langCopy">${langCopied ? '복사됨 ✓' : '문장 복사'}</button><button class="next" id="langNext">다음 문장 ›</button></div>
      </div>
    </section>
  </div>`;
  $('#main').querySelectorAll('button[data-cat]').forEach(b => b.addEventListener('click', () => { langCat = b.dataset.cat; langCopied = false; renderLang(); }));
  $('#main').querySelectorAll('.phraserow[data-i]').forEach(el => el.addEventListener('click', () => { langIdx = +el.dataset.i; langCopied = false; renderLang(); }));
  $('#langCopy')?.addEventListener('click', async () => { try { await navigator.clipboard.writeText(p.ja || ''); langCopied = true; renderLang(); } catch(e){} });
  $('#langNext')?.addEventListener('click', () => { const pos = idxs.indexOf(curI); langIdx = idxs[(pos + 1) % idxs.length]; langCopied = false; renderLang(); });
}

/* ---- 알아둘 것 ---- */
function renderInfo(){
  const calls = [
    { label: '경찰', num: '110', note: '사건·사고·분실', href: 'tel:110', bg: 'var(--ink2)' },
    { label: '구급차 · 화재', num: '119', note: '응급 상황', href: 'tel:119', bg: 'var(--accent)' },
    { label: '외교부 영사콜센터', num: '+82-2-3210-0404', note: '24시간 · 한국어', href: 'tel:+82232100404', bg: 'var(--ink2)' },
    { label: '일본 관광 안내 (JNTO)', num: '050-3816-2787', note: '24시간 · 다국어', href: 'tel:05038162787', bg: 'var(--ink2)' }
  ];
  const tips = DATA.tips || [];
  const cats = Array.from(new Set(tips.map(t => t.cat)));
  const callSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>';
  $('#main').innerHTML = `
  <div class="tabhead"><div class="eyebrow">누르면 바로 전화가 연결돼요</div><h2>알아둘 것</h2></div>
  <div class="callgrid">${calls.map(c => `<a class="callcard" href="${c.href}"><div class="tx"><div class="lab">${esc(c.label)}</div><div class="num">${esc(c.num)}</div><div class="note">${esc(c.note)}</div></div><span class="ic" style="background:${c.bg}">${callSvg}</span></a>`).join('')}</div>
  ${cats.map(cat => `<div class="tipgroup"><h4>${esc(cat)}</h4>${tips.filter(t => t.cat === cat).map(t => `<div class="tipcard"><div class="t">${esc(t.title)}${t.must ? '<span class="must">꼭</span>' : ''}</div><div class="b">${esc(t.body)}</div></div>`).join('')}</div>`).join('')}`;
}

function mdOf(s){ const d = isoToDate(s); return (d.getMonth()+1)+'/'+d.getDate(); }
function goView(n){ view = Math.min(Math.max(n, 1), DATA.days.length); renderApp(); }

/* ---- 탭 전환 ---- */
const TAB_FNS = { today: renderToday, record: renderRecord, schedule: renderSchedule, map: renderMapTab, lang: renderLang, info: renderInfo };
function setTab(t){ if (!TAB_FNS[t]) return; TAB = t; renderApp(); try{ $('#main').scrollIntoView({block:'start'}); }catch(e){} window.scrollTo(0,0); }
function renderApp(){
  if (TAB !== 'today' && TAB !== 'map') destroyMap();
  renderNav();
  (TAB_FNS[TAB] || renderToday)();
}

function renderNav(){
  const icons = {
    today: 'M13.5 5.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM9.8 8.9L7 23M9.8 8.9l3.2 1.6 1.8 3.5H19M9.8 8.9L6 10.5V14M12.5 15l2.5 3v5',
    rec: 'M3 12h4l2-4 3 8 2-4h7M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10',
    all: 'M4 6h16v14H4zM4 10h16M8 3v5M16 3v5',
    map: 'M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
    ja: 'M4 5h16v11H9l-5 4zM9 10.5h.01M12 10.5h.01M15 10.5h.01',
    tips: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01'
  };
  const items = [
    ['오늘 일정', icons.today, 'today'],
    ['기록', icons.rec, 'record'],
    ['전체 일정', icons.all, 'schedule'],
    ['지도', icons.map, 'map'],
    ['일본어', icons.ja, 'lang'],
    ['알아둘 것', icons.tips, 'info']
  ];
  $('#bottomnav').innerHTML = items.map(([label, d, key]) => `<a href="#" class="${key===TAB?'on':''}" data-tab="${key}"><span class="bar"></span><span class="pill"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"></path></svg></span><span class="lb">${label}</span></a>`).join('');
  $('#bottomnav').querySelectorAll('a[data-tab]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); setTab(a.dataset.tab); }));
}

(function(){
  const L={light:['☀','밝게'],dark:['🌙','어둡게'],auto:['◐','자동']}, order=['light','dark','auto'];
  const get=()=>{try{return localStorage.getItem('tk-theme')||'light'}catch(e){return 'light'}};
  const apply=t=>{const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t); $('#themeBtn').textContent=L[t][0];};
  apply(get());
  $('#themeBtn').onclick=()=>{const t=order[(order.indexOf(get())+1)%3]; try{localStorage.setItem('tk-theme',t)}catch(e){} apply(t);};
})();

renderApp();
setTimeout(loadHC, 300);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (!HCLAST || Date.now() - (HCLAST.at || 0) > 9e5) loadHC(); });
</script>
