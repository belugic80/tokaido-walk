<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=880">
<title>도카이도 53개의 쉼표</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#1a5ead">
<script>try{var t=localStorage.getItem('tk-theme')||'light';if(t!=='auto')document.documentElement.setAttribute('data-theme',t)}catch(e){document.documentElement.setAttribute('data-theme','light')}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 레이아웃: 폴드 펼침 화면 고정폭 880px · 4칸 격자(gap 13px)를 모든 가로 묶음이 공유 */
:root{
  --bg:#f3f4f7; --card:#ffffff; --line:#e1e4ea; --sub:#f6f7f9;
  --ink:#1b2130; --ink-soft:#424a5b; --ink-faint:#5d6475;
  --accent:#2a78d6; --accent-ink:#1a5ead; --accent-bg:#e8f1fc;
  --walk:#2a78d6; --train:#c4511f; --see:#12855c;
  --walk-bg:#e8f1fc; --train-bg:#fdeee6; --see-bg:#e3f5ec;
  --amber:#8f5500; --amber-bg:#fff3dc; --danger:#c8364c; --danger-bg:#fdebee;
  --bar:#cdd2db;
  --menu:#0f7a55; --menu-bg:#e3f5ec; --sat:#1f5fbf;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11141a; --card:#1a1e26; --line:#2b313c; --sub:#20252e;
  --ink:#e9ecf2; --ink-soft:#c3c9d4; --ink-faint:#9ba3b2;
  --accent:#3987e5; --accent-ink:#83b8f4; --accent-bg:#192a40;
  --walk:#3987e5; --train:#e0703f; --see:#2bb183;
  --walk-bg:#192a40; --train-bg:#3a2216; --see-bg:#14332a;
  --amber:#f2b65c; --amber-bg:#33270e; --danger:#ec6f84; --danger-bg:#3a1c22;
  --bar:#3a4250; --menu:#2bb183; --menu-bg:#14332a; --sat:#7fb2f5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#11141a; --card:#1a1e26; --line:#2b313c; --sub:#20252e;
  --ink:#e9ecf2; --ink-soft:#c3c9d4; --ink-faint:#9ba3b2;
  --accent:#3987e5; --accent-ink:#83b8f4; --accent-bg:#192a40;
  --walk:#3987e5; --train:#e0703f; --see:#2bb183;
  --walk-bg:#192a40; --train-bg:#3a2216; --see-bg:#14332a;
  --amber:#f2b65c; --amber-bg:#33270e; --danger:#ec6f84; --danger-bg:#3a1c22;
  --bar:#3a4250; --menu:#2bb183; --menu-bg:#14332a; --sat:#7fb2f5; color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;font-size:13px;line-height:1.6;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
#app{width:880px;margin:0 auto;min-height:100vh;background:var(--bg)}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
b,strong{font-weight:800}

/* 머리 */
.top{position:sticky;top:-123px;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px 0} /* 제목·진행 길은 스크롤되면 올라가고, 날짜 줄과 탭만 위에 남음 */
.brand{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;padding:2px 0 10px}
.brand h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.025em;line-height:1.35;white-space:nowrap}
.brand h1 em{font-style:normal;color:var(--accent-ink)}
.brand .ja{font-size:13px;font-weight:600;color:var(--ink-faint);letter-spacing:.01em}
.toolbar{display:flex;align-items:center;gap:8px}
.step{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.step:disabled{opacity:.35;cursor:default}
.daypick{height:44px;width:230px;justify-content:center;padding:0 12px;border:1.5px solid var(--accent);border-radius:10px;background:var(--card);color:var(--accent-ink);font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.daypick small{font-size:11.5px;font-weight:700;color:var(--ink-faint)}
.spacer{flex:1}
.state{height:44px;width:230px;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin-top:6px}
.tabs button{height:44px;border:0;background:none;border-bottom:3px solid transparent;font-size:13.5px;font-weight:500;color:var(--ink-soft)}
.tabs button[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--accent-ink);font-weight:800}

main{padding:14px 20px 20px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:8px}
.sh{display:flex;flex-direction:column;gap:2px}
.sh h2{margin:0;font-size:14.5px;font-weight:800;padding-left:11px;border-left:3px solid var(--accent)}
.sh p{margin:0;padding-left:14px;font-size:11.5px;font-weight:500;color:var(--ink-faint)}
.sh.row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px}
.sh.row p{padding-left:0;text-align:right}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 13px}
.s2{grid-column:span 2}.s4{grid-column:span 4}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{margin:0;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.card h3 .aside{font-size:11px;font-weight:500;color:var(--ink-faint)}
.lab{font-size:11px;font-weight:700;color:var(--ink-faint)}
.muted{color:var(--ink-faint)}
.paren{color:var(--ink-faint);font-weight:400}
.num{color:var(--accent-ink);font-weight:800}
mark.warn{background:var(--amber-bg);color:var(--amber);font-weight:800;padding:0 3px;border-radius:3px}
.k{font-weight:800;color:var(--ink)}

/* 오늘 머리 */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;align-items:stretch}
.hero .hl{grid-column:span 2;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero .hl .chips{margin-top:auto}
.linkbtn{border:1.5px solid var(--accent);background:var(--card);color:var(--accent-ink);font-size:13px;font-weight:800;height:36px;padding:0 14px;border-radius:9px}
.recempty{flex-direction:row;align-items:center;gap:10px;font-size:14.5px;color:var(--ink-soft)}
.recempty .ic{color:var(--accent)}
.recform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 13px}
.recform label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.recform label span{font-weight:500;color:var(--ink-faint);font-size:11.5px}
.recform input{height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-size:18px;font-weight:700;font-family:inherit;background:var(--sub);color:var(--ink)}
.recform input:focus{outline:none;border-color:var(--accent)}
.recbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.stat .gauge{margin-top:4px}
.srcb{font-size:12px;font-weight:700;color:var(--see);background:var(--see-bg);padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.srcb.demo{color:var(--amber);background:var(--amber-bg)}
.is-demo .stat,.is-demo .card{border-style:dashed}
.unit{font-size:14px;font-weight:700}
.card.hcbox{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:14px;padding:10px 16px;margin-bottom:13px;font-size:15px}.hcbox>*{margin:0}.hcbox .lab{font-weight:800}.hcbox .linkbtn{margin-left:auto}
.recstrip{width:100%;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;text-align:left}
.recstrip.is-demo{border-style:dashed}
.recstrip .ic{color:var(--danger)}
.recstrip .go{margin-left:auto;font-size:13px;font-weight:800;color:var(--accent-ink);white-space:nowrap}
.mini-chart{padding:10px 12px 8px;gap:4px}
.ringrow svg{width:38px;height:38px}
.ringrow{display:flex;align-items:center;gap:10px}
.rbg{fill:none;stroke:var(--line);stroke-width:6}.rfg{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--ink-faint);font-family:inherit}
.chart .avg{stroke:var(--ink-faint);stroke-width:1.2;stroke-dasharray:4 4}
.chart .avgt{font-size:11.5px;font-weight:700;fill:var(--ink-soft)}
.chart .hrline{fill:none;stroke:var(--danger);stroke-width:2.4;stroke-linejoin:round}
.chart .hrdot{fill:var(--danger)}.chart .hrt{font-size:12px;font-weight:800;fill:var(--danger)}
.recnav{display:flex;align-items:center;gap:8px;margin:2px 0 14px}.recnav .rnday{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap;height:44px;padding:0 16px;border:1px solid var(--accent);border-radius:10px;background:var(--card)}.recnav .rnday b{font-size:17px;color:var(--accent-ink)}.rnarea{display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--ink)}.rntrip{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--accent-ink);background:var(--accent-bg);padding:3px 9px;border-radius:999px}
.recnav .step:disabled{opacity:.35}
.loctrail{margin:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}.loctrail small{color:var(--ink-faint)}.loctrail .arr{color:var(--ink-faint)}

.chart .bar.on{fill:var(--accent-ink)}.pbar{cursor:pointer}
.tripdiv{display:flex;align-items:center;gap:12px;margin:26px 0 6px;color:var(--ink-faint);font-weight:800;font-size:13px}.tripdiv::before,.tripdiv::after{content:'';flex:1;height:1px;background:var(--line)}
.restmv{display:flex;flex-direction:column;gap:12px}.rmstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rmstat>span{display:flex;flex-direction:column;gap:2px;background:var(--sub);border-radius:10px;padding:10px 12px}.rmstat b{font-size:20px}.rmlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}.rmlist li{display:flex;gap:8px;align-items:flex-start}.rmlist .tag{flex:none;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px}.rmlist .tag.tr{background:var(--amber-bg);color:var(--amber)}.rmlist .tag.wk{background:var(--accent-bg);color:var(--accent-ink)}
.sess{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}.sess th{font-size:12.5px;color:var(--ink-faint);font-weight:700;text-align:right;padding:4px 6px;border-bottom:1px solid var(--line)}.sess th:first-child,.sess td:first-child{text-align:left}.sess td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--line)}.sess tfoot td{border-bottom:0;color:var(--ink-soft);font-weight:700}.sessempty{text-align:center;padding:30px 0;margin:0}
.chart .bar{fill:var(--accent)}.chart .bv{font-size:10px;font-weight:700;fill:var(--ink-soft)}
.chart .planline{fill:none;stroke:var(--ink-faint);stroke-width:2;stroke-dasharray:5 5}
.chart .actline{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round}
.chart .actdot{fill:var(--accent)}.chart .actt{font-size:13px;font-weight:800;fill:var(--accent-ink)}
.chart .plant{font-size:12px;font-weight:700;fill:var(--ink-faint)}
.legend{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.lg{display:inline-block;width:22px;height:0;border-top:3px solid var(--accent);margin-left:8px}.lg.plan{border-top:2px dashed var(--ink-faint);margin-left:0}
.recov{flex-direction:row;align-items:center;gap:22px;font-size:15px}
/* 기록 탭 추가 요소 */
.map-svg .wp{fill:var(--card);stroke:var(--accent);stroke-width:2}
.map-svg .mapt{font-size:11px;font-weight:700;fill:var(--ink-soft);paint-order:stroke;stroke:var(--card);stroke-width:3px}
.chart .elevfill{fill:var(--accent-bg)}.chart .elevline{fill:none;stroke:var(--accent);stroke-width:2.2}
.zbar{display:flex;height:30px;border-radius:8px;overflow:hidden;font-size:12.5px;font-weight:800;color:#fff}
.zbar span{display:flex;align-items:center;justify-content:center;min-width:34px}
.z0{background:#2f9e6e}.z1{background:#d8892b}.z2{background:var(--danger)}
.zleg{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-soft)}
.zleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.zwarn{margin:0}
.body{display:flex;flex-direction:column;gap:8px;flex:1} /* 좌우 카드 아래선 맞춤: 흐름표를 바닥에 */
.brow{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px}
.bn{font-size:14px;font-weight:700}
.bsc{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.bsc button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--sub);color:var(--ink-soft);font-size:14px;font-weight:700}
.bsc button.on{color:#fff;border-color:transparent}
.bsc .bv0.on,.bsc .bv1.on{background:#2f9e6e}.bsc .bv2.on,.bsc .bv3.on{background:#d8892b}.bsc .bv4.on,.bsc .bv5.on{background:var(--danger)}
.notebox{display:flex;flex-direction:column;gap:8px;flex:1}
.thumbs{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;min-height:130px}
.thumb{border:1.5px dashed var(--line);border-radius:10px;background:var(--sub);color:var(--ink-faint);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:0;font-size:13px;font-weight:700}
.thumb span{display:flex;align-items:center;gap:4px}
.thumb.has{border-style:solid}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lightbox{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.lightbox img{max-width:100%;max-height:80vh;border-radius:10px;object-fit:contain}
.lbbar{display:flex;gap:10px;align-items:center;color:#fff;font-size:14px;flex-wrap:wrap;justify-content:center}
.lbbar button{height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-size:14px;font-weight:700}
.lbbar button:disabled{opacity:.3}
.notebox .btns{margin-top:auto}
#noteMsg:empty{display:none}
.notebox textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:var(--sub);color:var(--ink);resize:vertical}
.photo{aspect-ratio:16/9;border-radius:10px;border:1.5px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);overflow:hidden;background:var(--sub)}
.photo img{width:100%;height:100%;object-fit:cover}
.notebox label.btn{cursor:pointer}
.spend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 13px}
.spend label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;color:var(--ink-soft)}
.spend label{gap:5px}
.curtg{display:inline-grid;grid-template-columns:1fr 1fr;width:84px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.curtg button{height:28px;border:0;background:var(--card);color:var(--ink-faint);font-size:12.5px;font-weight:700}
.curtg button.on{background:var(--accent);color:#fff}
.spend input{height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:17px;font-weight:700;background:var(--sub);color:var(--ink)}
.sptot{grid-column:1/-1;display:flex;align-items:center;gap:12px}.sptot b{font-size:20px}.sptot .btn{margin-left:auto;width:140px}
.chart .tr-sleep{fill:none;stroke:#6b5bd6;stroke-width:2.4}.chart .tr-sleep-dot{fill:#6b5bd6}
.chart .tr-rest{fill:none;stroke:var(--danger);stroke-width:2.4}.chart .tr-rest-dot{fill:var(--danger)}
.chart .tr-wt{fill:none;stroke:var(--see);stroke-width:2.4}.chart .tr-wt-dot{fill:var(--see)}
.chart .trt{font-size:12px;font-weight:800;fill:var(--ink)}
.wtform{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.wtform label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700}
.wtform label span{font-size:11px;font-weight:500;color:var(--ink-faint)}
.wtform input,.wtform select{height:42px;border:1.5px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:15px;font-weight:600;background:var(--sub);color:var(--ink);min-width:0}
.wtbtns{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wtlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

.wtbox{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end}
.wtbox label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
.wtbox label span{font-size:11.5px;font-weight:500;color:var(--ink-faint)}
.wtbox input{height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:18px;font-weight:700;background:var(--sub);color:var(--ink)}
.wtarrow{font-size:20px;color:var(--ink-faint);padding-bottom:10px}

.wtbox .btn{grid-column:1/-1}
.badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.badge2{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:10px;background:var(--sub);color:var(--ink-faint);text-align:center;opacity:.55}
.badge2.on{opacity:1;background:var(--accent-bg);color:var(--accent-ink)}
.badge2.secret{opacity:.7}
.badge2.secret b{letter-spacing:.04em}
.badge2 b{font-size:12.5px}.badge2 small{font-size:10.5px;line-height:1.3}
.stamps{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px}
.stamp{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;text-align:center;border:2px solid var(--line);color:var(--ink-faint)}

.sprow{display:grid;grid-template-columns:60px minmax(0,1fr) 240px;align-items:center;gap:12px;padding:6px 0;font-size:14.5px}
.sprow b{text-align:right}.sprow.tot{border-top:1.5px solid var(--ink);margin-top:4px;padding-top:10px}.sprow small{font-size:12px;color:var(--ink-faint);font-weight:500;display:block}
.spbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.spbar i{display:block;height:100%;background:var(--accent)}
.arrcard{gap:10px}
.arrrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto;gap:12px;align-items:end}
.arrrow > div,.arrrow label{display:flex;flex-direction:column;gap:3px;min-width:0}
.arrp{font-size:18px}.arrto{font-size:22px;color:var(--ink-faint);padding-bottom:8px}
.arrrow select{height:46px;border:1.5px solid var(--accent);border-radius:10px;padding:0 10px;font:inherit;font-size:15px;font-weight:700;background:var(--card);color:var(--ink);min-width:0}
.arrrow .btn{height:46px;padding:0 16px}
.arrres{border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.arrres.behind{background:var(--amber-bg)}.arrres.ahead{background:var(--see-bg)}
.arrres p{margin:0;font-size:15px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button{height:42px;border-radius:9px;border:1.5px solid var(--menu);background:var(--card);color:var(--menu);font-size:14px;font-weight:700}
.seg2 button.on{background:var(--menu);color:#fff}
.seg2.sm{display:inline-flex;gap:0;border:1.5px solid var(--menu);border-radius:9px;overflow:hidden}.seg2.sm button{height:34px;padding:0 13px;border:0;border-radius:0;font-size:13.5px}.seg2.sm button+button{border-left:1px solid var(--line)}
.chgnote{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--amber-bg);color:var(--ink);border-radius:9px;padding:7px 10px}
.chgnote .ic{color:var(--amber)}
.btrend{margin-top:auto;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.bt{display:grid;gap:3px;align-items:center}
.bth{font-size:11px;color:var(--ink-faint);text-align:center}.bth.now{color:var(--accent-ink);font-weight:800}
.btn2{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.btc{height:24px;border-radius:5px;background:var(--sub);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--ink-faint)}
.btc.l{background:#e1f3ea;color:#1f7a52}.btc.m{background:#fbead4;color:#9a5b00}.btc.h{background:var(--danger-bg);color:var(--danger)}
.bodyalert{display:flex;gap:10px;align-items:flex-start;background:var(--danger-bg);border-radius:12px;padding:10px 14px}
.bodyalert .ic{color:var(--danger);margin-top:2px}.bodyalert p{margin:2px 0 0;font-size:14.5px}
.rcol{display:flex;flex-direction:column;gap:10px;min-width:0} /* 오른쪽 상자들이 왼쪽 이동 순서와 같은 높이로 늘어남 */
.rcol > *{flex:1 1 auto}
.restx{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.restx .chips{margin-top:4px}
.chip.see{background:var(--see-bg);color:var(--see);border-color:transparent;display:inline-flex;align-items:center;gap:5px;padding:5px 11px;font-size:12.5px}
.chip.see .ic{flex:none}
.nextday{background:var(--sub);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.nextday .nd{font-size:13.5px;font-weight:700} /* 역참은 카드 아래쪽에 고정 → 오른쪽 경로 상자 아래선과 맞춤 */
.hero .hr{grid-column:span 2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;min-height:228px;align-content:stretch} /* 경로 점이 2~5개로 바뀌어도 카드 높이 고정 */
.vroute{grid-column:span 2;list-style:none;margin:0;padding:12px 14px;background:var(--sub);border-radius:10px;display:flex;flex-direction:column}
.vroute .lab{margin-bottom:6px}
.vroute li a{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;text-decoration:none;color:var(--ink);position:relative;padding:5px 0}
.vroute li:not(:last-child) a::after{content:"";position:absolute;left:12px;top:30px;bottom:-6px;width:2px;background:var(--walk);opacity:.35}
.vroute .vd{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--walk);background:var(--card);color:var(--walk);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.vroute .end .vd{background:var(--walk);color:#fff;font-size:9.5px}
.vroute .vn{font-size:13.5px;font-weight:700;line-height:1.35;word-break:keep-all}
.vroute .end .vn{font-weight:800}
.vroute .vt{font-size:12.5px;font-weight:800;color:var(--accent-ink)}
.vroute .vh{font-size:10.5px;font-weight:800;color:var(--see);margin-left:4px}
.mini{background:var(--sub);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.mini .big{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.mini .small{font-size:11px;color:var(--ink-faint)}
.hero .eyebrow{font-size:12px;font-weight:700;color:var(--ink-faint);display:flex;gap:8px;align-items:center}
.hero h2{margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.3}
.hero .path{font-size:15px;font-weight:700;color:var(--ink-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sub);color:var(--ink-soft);border:1px solid var(--line)}
.badge{font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-walk{background:var(--walk-bg);color:var(--walk)}
.b-train{background:var(--train-bg);color:var(--train)}
.b-see{background:var(--see-bg);color:var(--see)}

.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:3px}
.stat .big{font-size:23px;font-weight:800;letter-spacing:-.025em;line-height:1.25}
.stat .big.first{color:var(--accent-ink)}
.stat .small{font-size:11px;color:var(--ink-faint)}

/* 경로 줄 */
.route{position:relative;display:grid;gap:0;padding-top:4px}
.route .rail{position:absolute;top:19px;height:4px;border-radius:2px;background:var(--line)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;text-decoration:none;color:var(--ink);padding:0 4px;min-width:0}
.node .dot{width:32px;height:32px;border-radius:50%;background:var(--card);border:3px solid var(--walk);color:var(--walk);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.node.end .dot{background:var(--walk);color:#fff}
.node .nm{font-size:12px;font-weight:700;line-height:1.35;min-height:32px;word-break:keep-all}
.node .tag{font-size:10.5px;font-weight:800;color:var(--accent-ink)}
.node.here .dot{box-shadow:0 0 0 5px var(--accent-bg)}
.node.here .nm{color:var(--accent-ink);font-weight:800}

/* 지도 */
.map{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--sub);height:380px}
.mapgo{position:absolute;right:12px;bottom:34px;height:44px;padding:0 16px;border-radius:22px;background:var(--accent);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.map iframe{width:100%;height:calc(100% + 62px);margin-top:-62px;border:0;display:block} /* 마이맵 머리 띠(약 60px) 가리기 */
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.btn{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:800;text-decoration:none;border:1.5px solid var(--accent);color:var(--accent-ink);background:var(--card)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn:disabled{opacity:.4}

/* 이동 순서 */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid var(--line);align-items:start}
.tl li:last-child{border-bottom:0}
.tl .t{font-size:12.5px;font-weight:800;color:var(--ink-faint);padding-top:1px}
.tl .t.on{color:var(--accent-ink)}
.tl .t.tbd{font-size:10.5px;font-weight:600;color:var(--ink-faint);padding-top:3px;white-space:nowrap}
.tl .body{display:flex;flex-direction:column;gap:4px;min-width:0}
.tl .body .txt{font-size:13px;font-weight:600;line-height:1.5}
.nw{white-space:nowrap}
.tl .arr{color:var(--ink-faint);font-weight:400;padding:0 2px}

.hotel .nm{font-size:14px;font-weight:800}
.hotel .meta{font-size:12px;color:var(--ink-soft)}
.alt{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:2px}
.warnbox{background:var(--amber-bg);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.warnbox h3{color:var(--amber)}
.warnbox p{margin:0;font-size:13px;line-height:1.6}
.memo p{margin:0;font-size:12.5px;color:var(--ink-soft)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:12.5px}
.kv dt{font-size:11px;font-weight:700;color:var(--ink-faint);padding-top:2px}
.kv dd{margin:0;font-weight:600}

.info p,.info li{margin:0;font-size:13px;line-height:1.7}
.info ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.story p{margin:0;font-size:13.5px;line-height:1.7;color:var(--ink-soft)}

/* 전체 일정 */
.gauge{height:12px;border-radius:6px;background:var(--line);position:relative;overflow:hidden}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
table{width:100%;border-collapse:collapse}
table.sched{table-layout:fixed}
table.sched td{overflow:hidden;text-overflow:ellipsis}
th{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--ink)}
td{font-size:12.5px;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--sub)}
tr.past td{color:var(--ink-faint)}
tr.cur td{background:var(--accent-bg);color:var(--accent-ink);font-weight:800}
td.kmc{width:120px;text-align:right}
#view-all th:nth-child(-n+5),#view-all td:nth-child(-n+5){text-align:center} /* 일차·날짜·구분·숙박·하루 성격 가운데 정렬 */
.mbar{display:block;height:4px;border-radius:2px;margin:4px 0 0 auto;background:var(--bar)}
tr.cur .mbar{background:var(--accent)}
tr.past .mbar{background:var(--accent-bg)}

/* 알아둘 것·일본어 */
.must{font-size:10.5px;font-weight:800;color:var(--danger);background:var(--danger-bg);padding:1px 7px;border-radius:5px;white-space:nowrap}
.tip{border-bottom:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.tip:last-child{border-bottom:0}
.tip .tt{font-size:13.5px;font-weight:800;display:flex;gap:8px;align-items:center}
.tip p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.tip.m p{color:var(--ink);font-weight:600}
.jrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.2fr) minmax(0,1.2fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center;text-align:center}
.jrow:last-child{border-bottom:0}
.jrow .ko{font-size:17px;font-weight:700;line-height:1.4} /* 한국어·발음·일본어 같은 크기 */
.jrow.m .ko{color:var(--danger)}
.jrow .ja{font-size:17px;font-weight:700;line-height:1.4}
.jrow .pr{font-size:17px;font-weight:700;line-height:1.4;color:var(--accent-ink)}
.jrow .jt{grid-column:1 / -1;font-size:11.5px;color:var(--ink-faint);margin-top:-4px}
.filter{display:flex;flex-wrap:wrap;gap:8px}
.filter button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-size:12.5px;font-weight:600}
.tipf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.tipf button{height:40px;padding:0 6px;border-radius:10px}
.filter button small{font-size:11px;font-weight:600;opacity:.7;margin-left:2px}
.filter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
[hidden]{display:none!important}
/* 아이콘·장식 */
.ic{flex:none;vertical-align:-3px}
.sh h2{display:flex;align-items:center;gap:7px}
.sh h2 .ic{color:var(--accent)}
.card h3 .ic{color:var(--accent)}
.lab .ic{color:var(--accent);margin-right:4px;vertical-align:-2px}
.tabs button{display:flex;align-items:center;justify-content:center;gap:7px}
.tabs button .ic{opacity:.75}
.tabs button[aria-selected="true"] .ic{opacity:1}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px}
.btn .ic{margin-right:0}
.btn{gap:6px;white-space:nowrap}
.brand{position:relative;overflow:hidden}
.brand h1,.brand .ja{position:relative}
.art{position:absolute;top:0;height:64px;color:var(--accent);opacity:.16;pointer-events:none}
.art-l{left:-14px;width:150px}.art-r{right:-6px;width:170px}
.trail{display:flex;align-items:center;gap:10px;margin:14px 0 22px;font-size:11.5px;font-weight:700;color:var(--ink-soft)}
.trail .end{display:flex;align-items:center;gap:4px;white-space:nowrap}
.trail .end .ic{color:var(--accent)}
.trail .km{font-size:11px;color:var(--ink-faint);white-space:nowrap}.trail .km b{color:var(--accent-ink)}
.track{flex:1;position:relative;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 12px)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.track .mk{position:absolute;top:-3px;transform:translateX(-50%)}
.track .mk b{display:block;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--bar)}
.track .mk em{position:absolute;top:13px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9.5px;font-weight:600;color:var(--ink-faint);white-space:nowrap}
.track .walker{position:absolute;top:-24px;transform:translateX(-50%);color:var(--accent-ink);transition:left .4s}
@media (prefers-reduced-motion:reduce){.track .walker{transition:none}}
.foot{margin:6px 20px 24px;padding:16px 4px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-soft)}
.foot .ic{color:var(--accent)}
.foot .muted{margin-left:auto}
.hero{position:relative;overflow:hidden}
.dt.sat{color:var(--sat)!important}.dt.sun{color:var(--danger)!important}
.holi{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:var(--danger-bg);color:var(--danger)}
/* 지나가는 곳 메뉴: 3칸 같은 크기, 고른 칸은 초록으로 채움 */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg button{height:46px;border-radius:10px;border:1.5px solid var(--menu);background:var(--card);color:var(--menu);font-size:14px;font-weight:700}
.seg button[aria-selected="true"]{background:var(--menu);color:#fff;font-weight:800}
.seg button:disabled{border-color:var(--line);color:var(--ink-faint);cursor:default}
.seg small{font-size:11px;font-weight:500}
.strip-tools{display:flex;margin-top:-2px}
.pp{display:flex;flex-direction:column;gap:10px}
/* 사진 줄: 한 화면 4.5장, 좌우로 밀기 */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 40px) / 4.5);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding-bottom:6px}
.ph{scroll-snap-align:start;margin:0;display:flex;flex-direction:column;gap:5px;min-width:0}
.ph .img{aspect-ratio:4/3;border-radius:10px;background:var(--sub);overflow:hidden;border:1px solid var(--line)}
.ph .img img{width:100%;height:100%;object-fit:cover;display:block}
.ph.loading .img{background:linear-gradient(90deg,var(--sub),var(--line),var(--sub));background-size:200% 100%;animation:shim 1.2s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.ph.loading .img{animation:none}}
.ph figcaption{font-size:12px;font-weight:800;line-height:1.35;word-break:keep-all}
.ph .ds{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);line-height:1.4;margin-top:2px}
.more{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:4px}
.ph .cr{font-size:10px;font-weight:500;color:var(--ink-faint);text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arrows{margin-left:auto;display:flex;gap:6px}
.arrows button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center}
.stayimg{aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--sub);border:1px solid var(--line);margin:0;position:relative}
.stayimg img{width:100%;height:100%;object-fit:cover;display:block}
.staymap{width:100%;height:100%;min-height:240px;border:0;display:block}
.stayimg figcaption{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
.stayimg figcaption a{color:#fff}

/* ── 큰 글씨: 설명·긴 글은 크게, 진하게 (사용자 요청) ── */
body{font-size:15.5px;line-height:1.65}
.lab{font-size:12.5px}
.stat .small,.mini .small,.small{font-size:12.5px}
.chip{font-size:13px}
.info p,.info li{font-size:15.5px;line-height:1.75;color:var(--ink)}
.info ul{gap:7px}
.story p{font-size:16px;line-height:1.8;color:var(--ink)}
.tip .tt{font-size:16.5px}
.tip p{font-size:16px;line-height:1.75;color:var(--ink)}
.tip.m p{font-weight:700}
.tl .t{font-size:14px}
.tl .body .txt{font-size:15.5px}
.tl .t.tbd{font-size:12px}
.hotel .nm{font-size:16.5px}
.hotel .meta{font-size:14px;color:var(--ink)}
.warnbox p{font-size:15.5px;line-height:1.7}
.memo p{font-size:15px;color:var(--ink)}
.kv{font-size:14.5px}.kv dt{font-size:12.5px}
.hero .eyebrow{font-size:13px}
.hero .path{font-size:16.5px}
.vroute .vn{font-size:15px}.vroute .vt{font-size:14px}
.ph figcaption{font-size:13.5px}.ph .ds{font-size:12.5px}
.nextday .nd{font-size:15px}
td{font-size:14px}th{font-size:12.5px}
.sh.row p{font-size:12.5px}
.card h3{font-size:15.5px}
.paren{color:var(--ink-soft)}

/* ── 간격 더 촘촘히 (스크롤 줄이기) ── */
main{gap:10px;padding-top:10px}
section{gap:6px}
.grid{gap:8px 13px}
.sh h2{line-height:1.3}
.stat{padding:8px 14px;gap:1px}
.stat .big{line-height:1.2}
.card{padding:10px 14px;gap:6px}
.hero{padding:12px 16px}
.recstrip{padding:9px 16px}

/* ── 규칙: 나란한 박스는 높이를 같게, 안쪽 내용이 아래까지 차게 ── */
.grid > *{min-height:0}
.stat > .small:last-child,.stat > .gauge:last-child{margin-top:auto}
.stat > .ringrow{flex:1}
.stayimg{aspect-ratio:auto;min-height:240px;height:100%}
.tl{flex:1;justify-content:space-between}
.badges{flex:1;grid-auto-rows:1fr}
.card > .chart:last-child,.card > .map-svg{flex:1;height:100%;min-height:150px}
.story p{flex:1}

/* 오늘 숙소 강조, 대안은 흐리게 */
.hmain{background:var(--accent-bg);border:1.5px solid var(--accent);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.htag{font-size:12px;font-weight:800;color:var(--accent-ink);display:flex;align-items:center;gap:4px}
.hmain .nm{font-size:18px;font-weight:800;color:var(--accent-ink)}
.hotel .alt{border-top:0;padding-top:2px;opacity:.75}

고속버스는 하루 2편뿐이라 미리 예약하세요.", "must": false}, {"cat": "날씨·걷기", "title": "일정은 유동적으로", "body": "몸이 힘들거나 비·부상이 있으면 그날 걷기를 줄이고 가까운 역에서 기차·버스로 숙소까지 가세요(전체 일정 메모의 '힘들 때·비 올 때' 줄 참고). 하루를 통째로 미뤄야 하면 쉬는 날(5일차 하코네·9일차 오키쓰·15일차 하마나호·20일차 구와나)을 쓰거나, 26일차 교토 예비일로 하루를 메웁니다. 숙소는 1주 전쯤 예약하되, 요금이 크게 오르는 12월 31일·1월 1일(아리마) 숙소만은 미리 잡아 두세요.", "must": false}, {"cat": "날씨·걷기", "title": "12월 날씨", "body": "태평양 쪽은 맑고 건조합니다. 낮 10~13도, 아침 0~5도. 하코네 고개와 스즈카 고개는 더 춥고 바람이 셉니다.", "must": false}, {"cat": "날씨·걷기", "title": "해 지는 시간", "body": "12월에는 해가 오후 4시 반 무렵에 집니다. 걷는 날은 아침 8시쯤 출발해 오후 4시 전 도착을 목표로 하세요. 산길은 해 지기 전에 반드시 내려오세요.", "must": false}, {"cat": "날씨·걷기", "title": "하코네 고개 결빙·폭설 위험 (4·6일차)", "body": "하코네 옛 돌길·하코네 고개는 12월에 비가 눈으로 바뀌거나 그늘진 돌길에 얼음이 낄 수 있습니다. 출발 전날 밤 날씨와 적설·결빙 예보를 꼭 확인하세요. 길이 미끄럽거나 눈이 쌓였으면 걷기를 접고 '하코네 토잔 버스'로 오다와라↔하코네마치/모토하코네 구간을 넘는 플랜 B로 바꾸세요 (옛길과 거의 같은 경로를 버스가 다닙니다). 작은 아이젠(체인 스파이크)을 배낭에 챙기면 얼어붙은 돌길에서 안전합니다.", "must": false}, {"cat": "날씨·걷기", "title": "화장실·물", "body": "길에 공중화장실이 적어 편의점·역·도로 휴게소(미치노에키)를 이용합니다. 수돗물은 마셔도 됩니다. 화장실 휴지는 변기에 흘려보냅니다.", "must": false}, {"cat": "매너", "title": "쓰레기", "body": "거리에 쓰레기통이 거의 없습니다. 작은 봉투를 들고 다니다 편의점이나 숙소에서 버리세요.", "must": false}, {"cat": "매너", "title": "걸으며 먹기", "body": "걸으면서 먹는 것을 좋지 않게 보는 지역이 있습니다. 산 가게 앞이나 벤치에서 먹고 가세요.", "must": false}, {"cat": "매너", "title": "흡연", "body": "길거리 흡연 금지 구역이 많아 지정 흡연소에서만 피웁니다.", "must": false}, {"cat": "매너", "title": "전철", "body": "전철 안에서는 통화하지 않고 휴대폰은 진동으로 합니다. 에스컬레이터는 도쿄는 왼쪽, 오사카는 오른쪽에 서는 편입니다.", "must": true}, {"cat": "매너", "title": "신발 벗기", "body": "료칸, 일부 식당, 성 천수각 안, 신사·절 건물 안에서는 신발을 벗습니다. 구멍 없는 양말을 챙기세요.", "must": false}, {"cat": "매너", "title": "신사 참배", "body": "도리이 한가운데는 신이 다니는 길이라 가장자리로 걷습니다. 손 씻는 곳(데미즈야)에서 손과 입을 헹구고, '두 번 절, 두 번 박수, 한 번 절'로 참배합니다.", "must": false}, {"cat": "매너", "title": "온천 예절", "body": "탕에 들어가기 전에 몸을 씻고, 수건은 탕에 넣지 않으며, 긴 머리는 묶습니다. 문신이 있으면 입장을 거절하는 곳이 있습니다.", "must": true}, {"cat": "음식점", "title": "주문·대기", "body": "줄 서는 가게는 입구 명단에 이름을 적고 기다리는 곳이 많습니다. 라멘·우동집은 입구 자판기에서 식권을 먼저 사는 곳이 많습니 /* 1. 실제 경로 (계획 점선 + 실제 실선) */
function routeMap(d, r){
  if (!d.route.length) return '<p class="muted">이날은 걷는 경로가 없습니다.</p>';
  const pts = d.route.map(p => p.ll.split(',').map(Number));
  const act = r.track || (() => { const a = []; for (let i = 0; i < pts.length - 1; i++) for (let t = 0; t < 1; t += .1) {
    const [la, lo] = pts[i], [lb, lb2] = pts[i + 1]; a.push([la + (lb - la) * t + (rnd(d.n * 31 + i * 10 + t * 10) - .5) * .004, lo + (lb2 - lo) * t + (rnd(d.n * 17 + i * 10 + t * 10) - .5) * .004]); }
    a.push(pts[pts.length - 1]); return a; })();
  const all = pts.concat(act), la = all.map(p => p[0]), lo = all.map(p => p[1]);
  const W = 380, H = 220, P = 26, k = Math.cos(la[0] * Math.PI / 180);
  const sx = (Math.max(...lo) - Math.min(...lo)) * k || .01, sy = (Math.max(...la) - Math.min(...la)) || .01, sc = Math.min((W - 2 * P) / sx, (H - 2 * P) / sy);
  const X = p => P + ((p[1] - Math.min(...lo)) * k) * sc + ((W - 2 * P) - sx * sc) / 2, Y = p => H - P - (p[0] - Math.min(...la)) * sc - ((H - 2 * P) - sy * sc) / 2;
  const line = a => a.map(p => `${X(p).toFixed(1)},${Y(p).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart map-svg" role="img" aria-label="계획 경로와 실제 걸은 경로">
    <polyline points="${line(pts)}" class="planline"/><polyline points="${line(act)}" class="actline"/>
    ${pts.map((p, i) => `<circle cx="${X(p)}" cy="${Y(p)}" r="${i === 0 || i === pts.length - 1 ? 6 : 4}" class="${i === 0 || i === pts.length - 1 ? 'actdot' : 'wp'}"/>
      <text x="${X(p)}" y="${Y(p) - 10}" text-anchor="middle" class="mapt">${esc(d.route[i].name.replace(/\s*\(숙소\)\s*/, ''))}</text>`).join('')}</svg>`;
}

function elevChart(d, r){
  const hill = /고개|산길|돌길|오르막|내리막/.test(d.character || '');
  const peak = d.n === 4 || d.n === 6 ? 846 : d.n === 22 ? 378 : hill ? 300 : 40;
  const prof = r.elev || Array.from({ length: 41 }, (_, i) => { const t = i / 40;
    const base = d.n === 4 ? t : d.n === 6 ? 1 - t : Math.sin(t * Math.PI); return Math.max(5, Math.round(peak * base + (rnd(d.n * 3 + i) - .5) * (hill ? 30 : 10) + 10)); });
  const W = 380, H = 150, L = 40, R = 8, T = 16, B = 22, mx = Math.max(...prof, 100), top = Math.ceil(mx / 200) * 200;
  const X = i => L + i / (prof.length - 1) * (W - L - R), Y = v => T + (1 - v / top) * (H - T - B);
  const pts = prof.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  let gain = 0; prof.forEach((v, i) => { if (i && v > prof[i - 1]) gain += v - prof[i - 1]; });
  const mi = prof.indexOf(Math.max(...prof));
  elevChart.last = { gain, top: prof[mi] };
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="고도 변화, 최고 ${Math.max(...prof)}m">
    ${[0, top / 2, top].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v}m</text>`).join('')}
    <polygon points="${L},${Y(0)} ${pts} ${W - R},${Y(0)}" class="elevfill"/><polyline points="${pts}" class="elevline"/>
    <text x="${X(mi)}" y="${Y(prof[mi]) - 6}" text-anchor="middle" class="actt">${prof[mi]}m</text>
    <text x="${L}" y="${H - 5}" class="ax">출발</text><text x="${W - R}" y="${H - 5}" text-anchor="end" class="ax">도착</text></svg>`;
}

/* 8. 몸 상태 */
const BODY = [['foot', '발·물집'], ['knee', '무릎'], ['back', '허리·어깨'], ['tired', '피로']];
function bodyOf(n){ /* n일차 몸 상태: 직접 남긴 값, 없으면 예시 */
  const x = NOTE[n] && NOTE[n].body; if (x) return { b: x, demo: false };
  const d = DATA.days[n - 1]; if (!d || !demoDay(n)) return null;
  return { demo: true, b: { foot: n > 6 ? (n > 9 ? 1 : 2) : 1, knee: n === 6 || n === 7 ? 3 : n === 8 ? 2 : 1, back: 1, tired: d.km > 22 ? 3 : d.km ? 2 : 1 } };
}
function bodyTrend(n){ /* 최근 7일 흐름: 숫자를 칸에 적고 색은 보조 */
  const ds = []; for (let k = Math.max(1, n - 6); k <= n; k++) ds.push(k);
  return `<div class="btrend"><span class="lab">최근 흐름</span><div class="bt" style="grid-template-columns:78px repeat(${ds.length},minmax(0,1fr))">
    <span></span>${ds.map(k => `<span class="bth ${k === n ? 'now' : ''}">${k}일</span>`).join('')}
    ${BODY.map(([key, nm]) => `<span class="btn2">${nm}</span>${ds.map(k => { const o = bodyOf(k); const v = o ? o.b[key] : null;
      return `<span class="btc ${v == null ? '' : v >= 4 ? 'h' : v >= 2 ? 'm' : 'l'}">${v == null ? '·' : v}</span>`; }).join('')}`).join('')}</div></div>`;
}
/* 어제 몸 상태가 나쁘면 오늘 일정 화면에 대안을 먼저 보여줌 */
function bodyAlert(d){
  const o = bodyOf(d.n - 1); if (!o) return '';
  const bad = BODY.filter(([k]) => +o.b[k] >= 3); if (!bad.length) return '';
  const hill = /고개|산길|돌길/.test(d.character || '');
  const planB = lines(d.memo).concat(lines(d.mdMemo)).find(x => /플랜 B|비\s?올|힘들/.test(x));
  return `<div class="bodyalert">${I.heart}<div><b>어제 ${bad.map(([k, nm]) => `${nm} ${o.b[k]}`).join(' · ')}</b>${o.demo ? ' <span class="small">(예시)</span>' : ''}
    <p>${hill ? '오늘은 고개·산길 구간입니다. 무리하지 말고 아래 대안을 먼저 확인하세요.' : '쉬는 시간을 늘리고, 힘들면 기록 탭의 \'오늘 도착\'에서 기차로 건너뛰세요.'}</p>
    ${planB ? `<p class="small">${labeled(planB)}</p>` : ''}</div></div>`;
}
function bodyCheck(d){
  const o = bodyOf(d.n), demo = !!(o && o.demo), b = o ? o.b : {};
  const sum = BODY.reduce((s, [k]) => s + (+b[k] || 0), 0);
  return `<div class="body ${demo ? 'is-demo' : ''}">${BODY.map(([k, nm]) => `<div class="brow"><span class="bn">${nm}</span><span class="bsc">${[0, 1, 2, 3, 4, 5].map(v =>
    `<button type="button" class="bv${v} ${+b[k] === v ? 'on' : ''}" data-body="${k}" data-v="${v}" aria-label="${nm} ${v}점">${v}</button>`).join('')}</span></div>`).join('')}
    <p class="small" style="margin:0">0 괜찮음 ~ 5 아주 아픔 · 합계 <b>${sum}</b>${sum >= 10 ? ' · <mark class="warn">다음 걷는 날은 기차 구간을 고려하세요</mark>' : ''}${demo ? ' · 예시' : ''}</p>${bodyTrend(d.n)}</div>`;
}

/* 7. 오늘의 쉼표 (한 줄 일기 + 사진) */
function noteBox(d){
  const n = NOTE[d.n] || {}, demo = !n.text && !(n.photos && n.photos.length) && demoDay(d.n);
  return `<div class="notebox ${demo ? 'is-demo' : ''}">
    <textarea id="noteText" rows="3" maxlength="300" placeholder="오늘 하루를 한 줄로 남겨 보세요">${esc(n.text || '')}</textarea>

    <div class="thumbs" id="thumbs">${[0, 1, 2].map(i => `<button type="button" class="thumb" data-ph="${i}" aria-label="사진 ${i + 1}"><span>${Is.camera}${i + 1}</span></button>`).join('')}</div>
    <div class="btns"><label class="btn">${I.camera}사진 추가 (최대 3장)<input type="file" id="notePhoto" accept="image/*" multiple hidden></label><button type="button" class="btn primary" id="noteSave">저장</button></div>
    <span class="small" id="noteMsg"></span></div>`;

/* 9. 지출: 칸마다 엔/원 선택 (숙박은 아고다 원화 결제라 기본 '원') · 합계는 원화 기준 */
const SPEND = [['tr', '교통', '엔'], ['stay', '숙박', '원'], ['food', '식비', '엔'], ['etc', '기타', '엔']];
const toWon = (v, c) => c === '원' ? +v || 0 : won(+v || 0);
function hotelPrice(d){ const hd = hotelDay(d); const m = String(hd.h1 || '').match(/([\d,]+)\s*원\/박/); return m ? +m[1].replace(/,/g, '') : ''; }
function spendOf(d){
  const n = NOTE[d.n];
  if (n && n.spend) { const o = {}; SPEND.forEach(([k, , c0]) => { const x = n.spend[k]; o[k] = x && typeof x === 'object' ? x : { v: x ?? '', c: c0 }; }); return { sp: o, demo: false }; }
  if (demoDay(d.n)) return { demo: true, sp: { tr: { v: d.yen || 0, c: '엔' }, stay: { v: hotelPrice(d) || 0, c: '원' }, food: { v: 3200 + Math.round(rnd(d.n) * 2500), c: '엔' }, etc: { v: Math.round(rnd(d.n + 9) * 1500), c: '엔' } } };
  return { demo: false, sp: { tr: { v: d.yen || '', c: '엔' }, stay: { v: hotelPrice(d), c: '원' }, food: { v: '', c: '엔' }, etc: { v: '', c: '엔' } } };
}
function spendBox(d){
  const { sp, demo } = spendOf(d);

  return `<form class="spend ${demo ? 'is-demo' : ''}" id="spendForm">${SPEND.map(([k, nm]) => `<label>${nm}
      <span class="curtg">${['엔', '원'].map(c => `<button type="button" class="${sp[k].c === c ? 'on' : ''}" data-cur="${k}" data-c="${c}">${c}</button>`).join('')}</span>
      <input id="sp-${k}" type="number" inputmode="numeric" value="${sp[k].v ?? ''}" data-c="${sp[k].c}"></label>`).join('')}
    <div class="sptot"><span class="lab">오늘 합계</span><b>${totW.toLocaleString()}원</b><span class="small">엔 칸은 1엔 = ${DATA.rate}원으로 환산${demo ? ' · 예시' : ''}</span><button type="submit" class="btn primary">저장</button></div></form>`;
}
/* 다닌 곳: 사이트를 열 때 잡힌 휴대폰 위치로 그날 지역 표시 (여행 쉬는 날은 숙소 주변) */

  const mv = td ? (td.steps || []).filter(x => x.k === '교통' || x.k === '걷기') : [];

  const askBtn = !locs.length && k === todayIso() && LOCPERM !== 'granted' ? `<button class="btn" id="locOn">${I.pin || ''}위치 켜기 · 지역 자동 표시</button>` : '';

      <div class="map" style="height:200px"><iframe title="이날 다닌 곳 지도" loading="lazy" src="https://www.google.com/maps/d/embed?mid=${MYMAP_MID}&ehbc=2E312F&ll=${c}&z=13"></iframe></div></div>
    <div class="card s2 restmv"><h3>${I.foot}움직임</h3>
      <div class="rmstat"><span><span class="lab">걸은 거리</span><b class="num">${r.km != null && r.km !== '' ? (+r.km).toFixed(1) + 'km' : '—'}</b></span>
        <span><span class="lab">걸음</span><b class="num">${r.steps ? Number(r.steps).toLocaleString() : '—'}</b></span>

    </div>`;

function dayExtras(k, r){
  const td = tripDayOf(k); r = r || {};
  const route = td && td.route.length && k <= todayIso();

      <div class="card s2">${(() => { const svg = elevChart(td, r), g = elevChart.last; return `<h3>${I.mountain}고도<span class="aside" style="margin-left:auto">오른 높이 <b class="num">${g.gain.toLocaleString()}m</b> · 최고 ${g.top}m</span></h3>${svg}`; })()}</div>` : placeCards(k, td, r)}
      <div class="card s4"><h3>${I.heart}심박 구간 <span class="aside">걷는 동안 어느 강도로 걸었나</span></h3>${hrZones(r)}</div>
    </div></section>
    ${td ? `<section><div class="sh"><h2>${I.note}오늘 남기기</h2><p>도카이도 ${td.n}일차</p></div><div class="grid">
      <div class="card s2"><h3>${I.foot}몸 상태</h3>${bodyCheck(td)}</div>

      <div class="card s4"><h3>${I.gift}오늘 지출</h3>${spendBox(td)}</div>

/* ── 기간별 추이: 최근 7일 · 30일 · 전체 ── */
let PER = '7', PERM = 'km';
try { PER = localStorage.getItem('tk-per') || '7'; PERM = localStorage.getItem('tk-perm') || 'km'; } catch(e){}
function periodSection(){
  const t = todayIso(), keys = Object.keys(DREC).filter(k => k <= t).sort();
  const first = keys[0] || t;
  const n = PER === 'all' ? Math.round((isoToDate(t) - isoToDate(first)) / 864e5) + 1 : +PER;
  const days = []; for (let i = n - 1; i >= 0; i--) days.push(addDays(t, -i));
  const val = k => { const r = DREC[k]; return r ? (PERM === 'km' ? +r.km || 0 : +r.steps || 0) : 0; };
  /* 60일이 넘으면 주 단위로 묶음 */
  let bars = days.map(k => ({ k, v: val(k), lab: n <= 7 ? dowOf(k) : mdOf(k) }));
  const weekly = bars.length > 60;
  if (weekly) { const w = []; for (let i = 0; i < bars.length; i += 7) { const g = bars.slice(i, i + 7); w.push({ k: g[0].k, v: g.reduce((a, b) => a + b.v, 0), lab: mdOf(g[0].k) }); } bars = w; }
  const rs = days.map(k => DREC[k]).filter(Boolean);
  const totKm = rs.reduce((a, r) => a + (+r.km || 0), 0), totSt = rs.reduce((a, r) => a + (+r.steps || 0), 0), totMin = rs.reduce((a, r) => a + (+r.min || 0), 0);
  const ws = days.map(k => DREC[k] && DREC[k].weight ? [k, +DREC[k].weight] : null).filter(Boolean);
  const wd = ws.length > 1 ? +(ws[ws.length - 1][1] - ws[0][1]).toFixed(1) : null;
  const W = 800, H = 210, L = 8, R = 8, T = 22, B = 26, mx = Math.max(...bars.map(b => b.v), PERM === 'km' ? 1 : 1000), bw = (W - L - R) / bars.length;
  const every = bars.length <= 14 ? 1 : Math.ceil(bars.length / 10);
  const fmt = v => PERM === 'km' ? (v >= 10 ? Math.round(v) : v.toFixed(1)) : v >= 1000 ? (v / 1000).toFixed(1) + '천' : v;
  const chart = `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="기간별 ${PERM === 'km' ? '걸은 거리' : '걸음 수'}">${bars.map((b, i) => {
      const bh = b.v / mx * (H - T - B), x = L + i * bw + bw * .16, w = Math.max(bw * .68, 2), y = H - B - bh, on = !weekly && b.k === recDate;
      return `<g class="pbar" data-date="${weekly ? '' : b.k}"><rect x="${L + i * bw}" y="${T - 4}" width="${bw}" height="${H - T - B + 4}" fill="transparent"/><rect x="${x}" y="${y}" width="${w}" height="${Math.max(bh, b.v ? 2 : 0)}" rx="3" class="bar${on ? ' on' : ''}"/>
        ${bars.length <= 31 && b.v ? `<text x="${x + w / 2}" y="${y - 5}" text-anchor="middle" class="bv">${fmt(b.v)}</text>` : ''}
        ${i % every === 0 ? `<text x="${x + w / 2}" y="${H - 7}" text-anchor="middle" class="ax">${b.lab}</text>` : ''}</g>`; }).join('')}</svg>`;
  const seg = (id, cur, opts) => `<span class="seg2 sm">${opts.map(([v, t]) => `<button type="button" data-${id}="${v}" class="${cur === v ? 'on' : ''}">${t}</button>`).join('')}</span>`;
  return `<section><div class="sh row"><h2>${I.mountain}기간별 운동량</h2><span style="display:flex;gap:8px">${seg('per', PER, [['7', '7일'], ['30', '30일'], ['all', '전체']])}${seg('perm', PERM, [['km', '거리'], ['steps', '걸음']])}</span></div>
    <div class="grid">
      <div class="stat"><span class="lab">${Is.foot}총 거리</span><span class="big first">${totKm.toFixed(1)}km</span><span class="small">${rs.length}일 기록 · 하루 평균 ${rs.length ? (totKm / rs.length).toFixed(1) : 0}km</span></div>
      <div class="stat"><span class="lab">${Is.steps}하루 평균 걸음</span><span class="big">${rs.length ? Math.round(totSt / rs.length).toLocaleString() : '—'}</span><span class="small">총 ${totSt.toLocaleString()}보</span></div>
      <div class="stat"><span class="lab">${Is.clock}걷기 운동 시간</span><span class="big">${hm(totMin)}</span><span class="small">${rs.filter(r => r.min).length}일 걷기 운동</span></div>
      <div class="stat"><span class="lab">${Is.heart}체중</span><span class="big">${ws.length ? ws[ws.length - 1][1] + '<small class="unit"> kg</small>' : '—'}</span><span class="small">${wd != null ? `기간 중 <b style="color:${wd <= 0 ? 'var(--see)' : 'var(--amber)'}">${wd > 0 ? '+' : ''}${wd}kg</b>` : '삼성 헬스 체중 기록'}</span></div>
      <div class="card s4"><h3>${I.steps}${PER === 'all' ? '전체' : '최근 ' + PER + '일'} ${PERM === 'km' ? '걸은 거리' : '걸음 수'}<span class="aside">${weekly ? '주 단위 합계' : '막대를 누르면 그날 기록으로 이동'}</span></h3>${chart}</div>
    </div></section>`;
}
function bindPeriod(){
  const v = $('#view-rec');
  v.querySelectorAll('[data-per]').forEach(b => b.onclick = () => { PER = b.dataset.per; try { localStorage.setItem('tk-per', PER); } catch(e){} renderRec(); });
  v.querySelectorAll('[data-perm]').forEach(b => b.onclick = () => { PERM = b.dataset.perm; try { localStorage.setItem('tk-perm', PERM); } catch(e){} renderRec(); });
  v.querySelectorAll('.pbar').forEach(g => { if (g.dataset.date) g.onclick = () => { recDate = g.dataset.date; recEdit = false; renderRec(); scrollTo(0, 0); }; });
}

/* ── 위치: 사이트를 열 때 휴대폰 위치 → 지역 이름 (이 폰에만 저장) ── */
let LOC = {}, LOCLAST = null, LOCPERM = 'prompt';
try { LOC = JSON.parse(localStorage.getItem('tk-loc') || '{}'); LOCLAST = JSON.parse(localStorage.getItem('tk-locl') || 'null'); } catch(e){ LOC = {}; }
async function placeName(la, lo){
  try { const j = await (await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${la}&longitude=${lo}&localityLanguage=ko`)).json();
    const city = String(j.city || j.principalSubdivision || '').replace(/특별시|광역시|특별자치시|시$/, '');
    const loc = String(j.locality || '').trim();
    return [city, loc && loc !== j.city ? loc : ''].filter(Boolean).join(' ') || null; } catch(e){ return null; }
}
function getLoc(force){
  if (!navigator.geolocation) { LOCPERM = 'denied'; return; }
  if (!force && LOCLAST && Date.now() - LOCLAST.at < 20 * 60e3) return;
  navigator.geolocation.getCurrentPosition(async pos => {
    LOCPERM = 'granted';
    const la = pos.coords.latitude, lo = pos.coords.longitude, nm = await placeName(la, lo), k = todayIso(), now = new Date();
    const t = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    const arr = LOC[k] = LOC[k] || [], prev = arr[arr.length - 1];
    if (!prev || prev.nm !== nm) arr.push({ t, la, lo, nm }); else { prev.la = la; prev.lo = lo; }
    LOCLAST = { la, lo, nm, at: Date.now() };
    try { localStorage.setItem('tk-loc', JSON.stringify(LOC)); localStorage.setItem('tk-locl', JSON.stringify(LOCLAST)); } catch(e){}
    renderRec();
  }, err => { LOCPERM = err.code === 1 ? 'denied' : LOCPERM; if (tab === 'rec') renderRec(); }, { enableHighAccuracy: false, timeout: 15000, maximumAge: 10 * 60e3 });
}
async function initLoc(){
  try { const st = await navigator.permissions.query({ name: 'geolocation' }); LOCPERM = st.state; st.onchange = () => { LOCPERM = st.state; }; } catch(e){}
  if (LOCPERM === 'granted') getLoc();
}

/* 4. 회복 추이 · 5. 체중 · 6. 도장판 · 10. 배지 · 지출 합계 */
function trendChart(vals, lo, hi, unit, cls, label){
  const W = 380, H = 150, L = 34, R = 8, T = 14, B = 22, n = DATA.days.length;
  const X = i => L + (i - 1) / (n - 1) * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const pts = vals.map(([i, v]) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const last = vals[vals.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${label}">
    ${[lo, (lo + hi) / 2, hi].map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v}${unit}</text>`).join('')}
    ${[1, 10, 20, 31].map(i => `<text x="${X(i)}" y="${H - 5}" text-anchor="middle" class="ax">${i}일</text>`).join('')}
    ${vals.length ? `<polyline points="${pts}" class="${cls}"/><circle cx="${X(last[0])}" cy="${Y(last[1])}" r="4" class="${cls}-dot"/><text x="${X(last[0]) + 7}" y="${Y(last[1]) + 4}" class="trt">${last[1]}${unit}</text>` : ''}</svg>`;
}
/* 체중: 잴 수 있을 때마다 입력 (출발 전 = 0, 1~31일차, 완주 후 = 32) → 점을 이은 그래프 */
let WT = []; try { const o = JSON.parse(localStorage.getItem('tk-wt') || '[]'); WT = Array.isArray(o) ? o : []; } catch(e){ WT = []; }
const saveWT = () => { try { localStorage.setItem('tk-wt', JSON.stringify(WT)); } catch(e){} };
let wtEdit = false;
const wtLabel = n => n === 0 ? '출발 전' : n === 32 ? '완주 후' : n + '일차';
function weightChart(pts, demo){
  if (!pts.length) return '<p class="muted" style="margin:0">아직 기록이 없습니다. 출발 전 집에서 한 번 재 주세요.</p>';
  /* 내가 넣은 체중 기준: 첫 기록(출발 체중)을 가운데 두고 위아래 ±4kg 이상 넓게 */
  const W = 380, H = 236, L = 42, R = 14, T = 14, B = 24;
  const vs = pts.map(p => p.kg), base = pts[0].kg;
  const lo = Math.floor(Math.min(base - 4, ...vs.map(v => v - 1))), hi = Math.ceil(Math.max(base + 4, ...vs.map(v => v + 1)));
  const X = n => L + n / 32 * (W - L - R), Y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const line = pts.map(p => `${X(p.day).toFixed(1)},${Y(p.kg).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="체중 변화">
    ${Array.from({ length: (hi - lo) / 2 + 1 }, (_, i) => lo + i * 2).map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" class="ax">${v}kg</text>`).join('')}
    <line x1="${L}" x2="${W - R}" y1="${Y(base)}" y2="${Y(base)}" class="avg"/><text x="${W - R}" y="${Y(base) - 5}" text-anchor="end" class="avgt">${wtLabel(pts[0].day)} ${base}kg</text>
    ${pts.map(p => `<text x="${X(p.day)}" y="${H - 5}" text-anchor="middle" class="ax">${p.day === 0 ? '출발' : p.day === 32 ? '완주' : p.day + '일'}</text>`).join('')}
    <polyline points="${line}" class="tr-wt"/>
    ${pts.map(p => `<circle cx="${X(p.day)}" cy="${Y(p.kg)}" r="4.5" class="tr-wt-dot"/><text x="${X(p.day)}" y="${Y(p.kg) - 9}" text-anchor="middle" class="trt">${p.kg.toFixed(1)}kg</text>`).join('')}</svg>
`;
}

/* 사진: 폰 브라우저 IndexedDB에 저장 (나중에 Supabase Storage) */
const idb = (() => { let p; return () => p || (p = new Promise((res, rej) => { try { const r = indexedDB.open('tk-photos', 1); r.onupgradeneeded = () => r.result.createObjectStore('p'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } })); })();
async function idbSet(k, v){ try { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('p', 'readwrite'); t.objectStore('p').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch(e){} }
async function idbGet(k){ try { const db = await idb(); return await new Promise(res => { const q = db.transaction('p').objectStore('p').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch(e){ return null; } }
async function idbDel(k){ try { const db = await idb(); db.transaction('p', 'readwrite').objectStore('p').delete(k); } catch(e){} }
function shrink(f, max, q){ return new Promise(res => { const rd = new FileReader(); rd.onload = () => { const img = new Image(); img.onload = () => {
  const c = document.createElement('canvas'), k = Math.min(1, max / Math.max(img.width, img.height)); c.width = img.width * k; c.height = img.height * k;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; img.src = rd.result; }; rd.readAsDataURL(f); }); }
async function fillThumbs(d){

    else t.onclick = () => document.getElementById('notePhoto').click(); });
}

/* ═══ 오늘 도착지 → 다음 걷는 날 자동 재구성 ═══
   ARR[n] = { day, i, mode }  : n일차에 실제로 도착한 지점 (day일차 경로의 i번째 지점), mode = 'next'(내일로 넘기기) | 'train'(기차로 건너뛰기) */
let ARR = {}; try { ARR = JSON.parse(localStorage.getItem('tk-arr') || '{}'); } catch(e){ ARR = {}; }
const saveArr = () => { try { localStorage.setItem('tk-arr', JSON.stringify(ARR)); } catch(e){} };
const nmOf = p => p.name.replace(/\s*\(숙소\)\s*/, '');
const nextWalk = n => DATA.days.find(x => x.n > n && x.km > 0);
const prevWalk = n => [...DATA.days].reverse().find(x => x.n < n && x.km > 0);
const fmtT = m => Math.floor(m / 60) + ':' + String(Math.round(m % 60)).padStart(2, '0');
const pad = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(Math.round(m % 60)).padStart(2, '0');
function dirUrl(route, mode){ const ll = route.map(p => p.ll); return `https://www.google.com/maps/dir/?api=1&travelmode=${mode || 'walking'}&origin=${ll[0]}&destination=${ll[ll.length - 1]}${ll.length > 2 ? '&waypoints=' + ll.slice(1, -1).join('%7C') : ''}`; }
function arrInfo(d){ /* n일차 도착 정보: 계획 대비 차이 */
  const a = ARR[d.n]; if (!a || !d.route.length) return null;
  const nx = nextWalk(d.n);
  if (a.day === d.n) { if (a.i === d.route.length - 1) return null; return { a, node: d.route[a.i], delta: +(d.nodes[a.i] - d.km).toFixed(1), nx }; }
  if (nx && a.day === nx.n) return { a, node: nx.route[a.i], delta: +nx.nodes[a.i].toFixed(1), nx };
  return null;
}
function eff(d){ /* 앞날 도착 변경을 반영한 '실제 일정' */
  if (!(d.km > 0)) return d;
  const p = prevWalk(d.n); if (!p) return d;
  const info = arrInfo(p); if (!info || info.nx.n !== d.n || (info.delta < 0 && info.a.mode !== 'next')) return d; /* 더 걸은 경우는 항상 반영 */
  let route, km;
  if (info.a.day === p.n) { route = p.route.slice(info.a.i, -1).concat(d.route.slice(1)); km = +(d.km + (p.km - p.nodes[info.a.i])).toFixed(1); }
  else { route = d.route.slice(info.a.i); km = +(d.km - d.nodes[info.a.i]).toFixed(1); }
  const st = tmin(d.start), wtO = tmin(d.wt), brk = tmin(d.arrive) - st - wtO, wt = km / 4 * 60, arr = st + wt + brk;
  const spare = tmin(d.sunset) - arr;
  return Object.assign({}, d, { route, km, wt: pad(wt), arrive: pad(arr), spare: fmtT(Math.max(spare, 0)), spareMin: spare, mapUrl: dirUrl(route),
    walkSeg: route.map(nmOf).join(' → '), changed: { km: d.km, from: p.n, delta: info.delta, at: nmOf(info.node) } });
}
function arrivalCard(d){
  if (!(d.km > 0) || !d.route.length) return '';
  const a = ARR[d.n], nx = nextWalk(d.n), last = d.route.length - 1;
  const opts = d.route.map((p, i) => i ? `<option value="${d.n}:${i}" ${a && a.day === d.n && a.i === i ? 'selected' : (!a && i === last ? 'selected' : '')}>${i === last ? '계획대로 · ' : ''}${esc(nmOf(p))} · ${d.nodes[i]}km 지점</option>` : '').join('')
    + (nx && nx.route.length ? `<optgroup label="더 걸었을 때 (${nx.n}일차 구간)">` + nx.route.map((p, i) => i ? `<option value="${nx.n}:${i}" ${a && a.day === nx.n && a.i === i ? 'selected' : ''}>${esc(nmOf(p))} · +${nx.nodes[i]}km</option>` : '').join('') + '</optgroup>' : '');
  const info = arrInfo(d), stayLL = d.route[last].ll;
  let res = '';
  if (info) {

const WX_CACHE = {};
function weatherBox(d){
  const dt = dateOf(d.n), diff = Math.round((dt - new Date(new Date().toDateString())) / 864e5);
  const id = 'wx-' + d.n;
  if (diff > 15 || diff < 0) return `<div class="card wx" id="${id}"><h3>${I.sunrise}오늘 날씨<span class="aside" style="margin-left:auto">${diff > 15 ? `예보는 ${d.date0 || d.date} 16일 전부터 나옵니다` : '지난 날짜'}</span></h3>
    <p class="small" style="margin:0">12월 평년: 태평양 쪽은 맑고 건조 · 낮 10~13도, 아침 0~5도 · 하코네·스즈카 고개는 더 춥고 바람이 셉니다.</p></div>`;
  return `<div class="card wx" id="${id}" data-wx="${ll(d)}" data-date="${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}"><h3>${I.sunrise}오늘 날씨<span class="aside" style="margin-left:auto">${esc(d.stay)} 기준 · 불러오는 중…</span></h3></div>`;
}
async function fillWeather(d){
  const el = document.querySelector('[data-wx]'); if (!el) return;
  const [la, lo] = el.dataset.wx.split(','), day = el.dataset.date, key = el.dataset.wx + day;
  try {
    const j = WX_CACHE[key] || (WX_CACHE[key] = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${la}&longitude=${lo}&hourly=temperature_2m,precipitation_probability,wind_speed_10m&timezone=Asia%2FTokyo&start_date=${day}&end_date=${day}`)).json());
    if (cur !== d.n) return;
    const hs = j.hourly.time.map((t, i) => [+t.slice(11, 13), Math.round(j.hourly.temperature_2m[i]), j.hourly.precipitation_probability[i], Math.round(j.hourly.wind_speed_10m[i])]).filter(([h]) => h >= 6 && h <= 18);
    const wet = hs.filter(([h, , p]) => h >= 7 && h <= 16 && p >= 60);
    el.innerHTML = `<h3>${I.sunrise}오늘 날씨<span class="aside" style="margin-left:auto">${esc(d.stay)} 기준 · 최저 ${Math.min(...hs.map(x => x[1]))}도 · 최고 ${Math.max(...hs.map(x => x[1]))}도</span></h3>
      <div class="wxrow">${hs.map(([h, t, p, w]) => `<span class="${p >= 60 ? 'rain' : ''}"><small>${h}시</small><b>${t}°</b><em>${p}%</em><i>${w}m</i></span>`).join('')}</div>
      <span class="small">기온 · 비 올 확률 · 바람(km/h)</span>
      ${wet.length ? `<p class="wxwarn"><mark class="warn">걷는 시간에 비 예보 (${wet[0][0]}시~) · 아래 '힘들 때 · 비 올 때'를 먼저 확인하세요</mark></p>` : ''}`;
  } catch(e){ el.querySelector('.aside').textContent = '날씨를 불러오지 못했습니다 (인터넷 연결 확인)'; }
}

  b.textContent = '인터넷 연결 없음 · 일정·일본어·긴급 연락처는 그대로 볼 수 있고, 지도·사진·날씨는 연결되면 보입니다';
}

    <div class="card" style="padding:4px 16px">${list.map(t => `<div class="tip ${t.must ? 'm' : ''}">
      <span class="tt">${t.must ? '<span class="must">필수</span>' : ''}${esc(t.title)}${tipCat === '필수' ? ` <span class="lab">${esc(t.cat)}</span>` : ''}</span>

/* 사진: 브라우저에서 위키백과·커먼즈 검색 (키 필요 없음) */
const PHOTO_CACHE = {};
function cacheGet(k){ if (PHOTO_CACHE[k]) return PHOTO_CACHE[k]; try { const v = sessionStorage.getItem('ph:' + k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function cacheSet(k, v){ PHOTO_CACHE[k] = v; try { sessionStorage.setItem('ph:' + k, JSON.stringify(v)); } catch(e){} }
async function wikiImg(q){
  const k = 'w:' + q; const c = cacheGet(k); if (c) return c;
  const u = 'https://ja.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=3&prop=pageimages|info&piprop=thumbnail&pithumbsize=600&inprop=url&gsrsearch=' + encodeURIComponent(q);
  try {
    const j = await (await fetch(u)).json();
    const ps = Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index).filter(p => p.thumbnail);
    const r = ps.length ? [{ src: ps[0].thumbnail.source, href: ps[0].fullurl, cr: '위키백과 · ' + ps[0].title }] : [];
    cacheSet(k, r); return r;
  } catch(e){ return []; }
}
async function commonsImgs(q, n){
  const k = 'c:' + q + n; const c = cacheGet(k); if (c) return c;
  const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url&iiurlwidth=600&gsrsearch=' + encodeURIComponent(q);
  try {
    const j = await (await fetch(u)).json();
    const ps = Object.values(j.query?.pages || {}).sort((a, b) => a.index - b.index)
      .filter(p => /\.(jpe?g|png)$/i.test(p.title) && p.imageinfo && p.imageinfo[0].thumburl);
    const r = ps.slice(0, n).map(p => ({ src: p.imageinfo[0].thumburl, href: p.imageinfo[0].descriptionurl, cr: '위키미디어 커먼즈' }));
    cacheSet(k, r); return r;
  } catch(e){ return []; }
}
function figure(ko, ph, desc){
  return `<figure class="ph"><a class="img" href="${esc(ph.href)}" target="_blank" rel="noopener"><img src="${esc(ph.src)}" alt="${esc(ko)}" loading="lazy" referrerpolicy="no-referrer"></a><figcaption>${esc(ko)}${desc ? `<span class="ds">${esc(desc)}</span>` : ''}<a class="cr" href="${esc(ph.href)}" target="_blank" rel="noopener">${esc(ph.cr)}</a></figcaption></figure>`;
}
/* 숙소 동네 사진: 맨 먼저 따로 불러옴 → 위키백과 → 커먼즈 → 그래도 없으면 숙소 위치 지도 */
async function fillStay(d){
  const token = d.n, si = document.getElementById('stayimg'); if (!si) return;
  const hd = hotelDay(d), sq = hd.stayQ, h = hotelInfo(d);
  let r = sq ? await wikiImg(sq) : [];
  if (!r.length && sq) r = await commonsImgs(sq, 1);
  if (!r.length && sq) r = await wikiImg(sq.replace(/(宿|駅|市)$/, ''));
  if (cur !== token || !document.body.contains(si)) return;
  si.innerHTML = r.length
    ? `<img src="${esc(r[0].src)}" alt="${esc(d.stay)} 동네" referrerpolicy="no-referrer"><figcaption>숙소 동네 · ${esc(d.stay)} — <a href="${esc(r[0].href)}" target="_blank" rel="noopener">${esc(r[0].cr)}</a></figcaption>`
    : `<iframe class="staymap" title="숙소 위치" loading="lazy" src="https://maps.google.com/maps?q=${h.ll}&z=16&output=embed"></iframe><figcaption>숙소 위치 · ${esc(h.ko)}</figcaption>`;
}
async function fillPhotos(d){
  fillStay(d);
  const token = d.n;
  for (const key of ['s', 'f', 'c']) {
    const items = d.photos[key] || []; const st = document.getElementById('strip-' + key);
    if (!st || !items.length) continue;
    /* 항목마다 사진 1장: 위키백과 대표 사진, 없으면 커먼즈에서 1장 */
    const res = await Promise.all(items.map(async ([ko, q, desc]) => {
      let ph = await wikiImg(q);
      if (!ph.length) ph = await commonsImgs(q, 1);
      return ph.length ? figure(ko, ph[0], desc) : '';
    }));
    if (cur !== token) return;
    const html = res.join('');
    if (html) st.innerHTML = html; else st.outerHTML = '<p class="muted" style="font-size:11.5px">사진을 불러오지 못했습니다 (인터넷 연결 확인)</p>';
  }

}

function go(n){ placeCat = 's'; recEdit = false; cur = Math.min(Math.max(n, 1), DATA.days.length); store.set('tk-day', cur); { const k = isoDay(dateOf(cur)); if (k <= todayIso()) recDate = k; } renderHeader(); renderDay(); renderRec(); renderAll(); }
function setTab(t){
  tab = t;
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === t));
  ['day','rec','all','tips','ja'].forEach(k => $('#view-' + k).hidden = k !== t);
  if (t === 'tips' && FX.rate) renderTips();
  const stepVis = t === 'day' || t === 'all';
  ['#prev','#next','#daylabel','#todayBtn'].forEach(s => $(s).style.visibility = stepVis ? 'visible' : 'hidden');
}

$('#prev').onclick = () => go(cur - 1);
/* 전체 화면: 크롬 주소창·탭 줄 숨기기 (버튼을 눌렀을 때만 가능) */

(function(){
  const L={light:['☀','밝게'],dark:['🌙','어둡게'],auto:['◐','자동']}, order=['light','dark','auto'];
  const get=()=>{try{return localStorage.getItem('tk-theme')||'light'}catch(e){return 'light'}};
  const apply=t=>{const r=document.documentElement; if(t==='auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',t);
    $('#themeBtn').innerHTML='<span aria-hidden="true">'+L[t][0]+'</span>'+L[t][1];};
  apply(get());
  $('#themeBtn').onclick=()=>{const t=order[(order.indexOf(get())+1)%3]; try{localStorage.setItem('tk-theme',t)}catch(e){} apply(t);};
})();
$('#fsBtn').onclick = async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch(e){}
};
document.addEventListener('fullscreenchange', () => $('#fsBtn').setAttribute('aria-pressed', !!document.fullscreenElement));
$('#next').onclick = () => go(cur + 1);
$('#todayBtn').onclick = () => go(Math.min(Math.max(todayN(), 1), DATA.days.length));
/* 삼성 헬스: 열 때 + 화면으로 돌아올 때(30분 간격) 새로 받기 */
setTimeout(loadHC, 300); setTimeout(initLoc, 600);
document.addEventListener('visibilitychange', () => { if (document.hidden) return; if (!HCLAST || Date.now() - (HCLAST.at || 0) > 9e5) loadHC(); if (LOCPERM === 'granted') getLoc(); if (recDate < todayIso() && tab !== 'rec') recDate = todayIso(); });

/* 화면이 880px보다 좁은 곳(미리보기 등)에서는 통째로 축소해 고정 배치 유지 */

cur = tn >= 1 && tn <= DATA.days.length ? tn : (saved || 1);
renderHeader(); renderDay(); renderRec(); renderAll(); renderTips(); renderJa(); fit(); netBanner(); loadFx();
</script>
